<title>Bogey Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: eine Spalte wie ein Scorekarten-Block – Kopf, Reiter, darunter Karten-Raster mit klassischen Symbolen (Kreis = Birdie, Quadrat = Bogey) */
:root {
  --bg: #eef3ef;
  --surface: #ffffff;
  --ink: #142019;
  --muted: #58675e;
  --line: #d3ddd5;
  --soft: #e3ebe5;
  --accent: #1c6641;
  --accent-ink: #ffffff;
  --accent-soft: #d6eadc;
  --danger: #b3261e;
  --s1: #1c6641; --s2: #c2410c; --s3: #2563eb; --s4: #a21caf; --s5: #a16207;
  --b-bronze: #a8692f; --b-silver: #7c8a93; --b-gold: #b8890b; --b-green: #1c6641; --b-copper: #8a5a44; --b-neg: #9b1c1c;
  --d-eagle: #0f4d2e; --d-birdie: #2f8f5b; --d-par: #9cc9ad; --d-bogey: #e3c37c; --d-double: #e0874f; --d-triple: #b83a2e; --d-strich: #c9d2cb;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  --m-bg: #e4eedf; --m-rough: #cfe3c4; --m-rough2: #c3dbb6; --m-wood: #8fb487; --m-range: #d6e8c9; --m-fairway: #86c47c; --m-water: #9fd0ec; --m-water-s: #6aaed6;
  --m-tee: #a6d79b; --m-green: #5fb86a; --m-green-s: #2f8a43; --m-sand: #f1e6bf; --m-sand-s: #d4c38c; --m-house: #c9bfae; --m-line: #1c6641;
  --m-label: #ffffff; --m-label-s: #1c6641; --m-label-t: #1c6641; --m-label-t2: #24382c; --m-flag: #e2b230; --m-head: #1c6641; --m-head-t: #ffffff;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1511; --surface: #16201a; --ink: #e4ece6; --muted: #92a399; --line: #2a3a31; --soft: #1d2a22;
  --accent: #62c28f; --accent-ink: #0a1a11; --accent-soft: #1f3a2b; --danger: #f2867e;
  --s1: #62c28f; --s2: #fb923c; --s3: #7aa7ff; --s4: #e879f9; --s5: #facc15;
  --b-bronze: #d8955a; --b-silver: #b9c5cc; --b-gold: #f0c541; --b-green: #62c28f; --b-copper: #c08a70; --b-neg: #ef5350;
  --d-eagle: #9be3bb; --d-birdie: #5cbf8a; --d-par: #2f6247; --d-bogey: #9a7a2e; --d-double: #c0652f; --d-triple: #e2665a; --d-strich: #33423a;
  --m-bg: #18241c; --m-rough: #1f3226; --m-rough2: #233a2b; --m-wood: #2c4a33; --m-range: #22362a; --m-fairway: #2f6a3f; --m-water: #24506b; --m-water-s: #3a7aa0;
  --m-tee: #3a7a49; --m-green: #4c9e5c; --m-green-s: #8fd8a3; --m-sand: #8d7c4f; --m-sand-s: #b09d68; --m-house: #4a463d; --m-line: #cfeedd;
  --m-label: #16201a; --m-label-s: #62c28f; --m-label-t: #e4ece6; --m-label-t2: #e4ece6; --m-flag: #f0c541; --m-head: #1f3a2b; --m-head-t: #e4ece6;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #16201a; --ink: #e4ece6; --muted: #92a399; --line: #2a3a31; --soft: #1d2a22;
  --accent: #62c28f; --accent-ink: #0a1a11; --accent-soft: #1f3a2b; --danger: #f2867e;
  --s1: #62c28f; --s2: #fb923c; --s3: #7aa7ff; --s4: #e879f9; --s5: #facc15;
  --b-bronze: #d8955a; --b-silver: #b9c5cc; --b-gold: #f0c541; --b-green: #62c28f; --b-copper: #c08a70; --b-neg: #ef5350;
  --d-eagle: #9be3bb; --d-birdie: #5cbf8a; --d-par: #2f6247; --d-bogey: #9a7a2e; --d-double: #c0652f; --d-triple: #e2665a; --d-strich: #33423a;
  --m-bg: #18241c; --m-rough: #1f3226; --m-rough2: #233a2b; --m-wood: #2c4a33; --m-range: #22362a; --m-fairway: #2f6a3f; --m-water: #24506b; --m-water-s: #3a7aa0;
  --m-tee: #3a7a49; --m-green: #4c9e5c; --m-green-s: #8fd8a3; --m-sand: #8d7c4f; --m-sand-s: #b09d68; --m-house: #4a463d; --m-line: #cfeedd;
  --m-label: #16201a; --m-label-s: #62c28f; --m-label-t: #e4ece6; --m-label-t2: #e4ece6; --m-flag: #f0c541; --m-head: #1f3a2b; --m-head-t: #e4ece6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 80px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1; text-transform: uppercase; }
h2 { font-size: 1.5rem; text-transform: uppercase; }
h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.brand { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.brand .logo { display: flex; align-items: center; gap: 14px; }
.brand .logo img { width: 76px; height: auto; flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.18)); }
@media (max-width: 520px) { .brand .logo img { width: 60px; } }
.mode { font-size: .78rem; color: var(--muted); font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px; border-bottom: 2px solid var(--ink); padding-top: 6px; overflow-x: auto; }
nav.tabs button { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; color: var(--muted); padding: 8px 12px 6px; cursor: pointer; border-radius: 6px 6px 0 0; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: var(--line); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
label.f { display: grid; gap: 4px; font-size: .78rem; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
label.f input, label.f select { font-family: var(--font-body); font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; }
.hint { color: var(--muted); font-size: .86rem; margin: 0; max-width: 65ch; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Rundenliste */
.list { display: grid; gap: 10px; }
.round { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; width: 100%; }
.round:hover { border-color: var(--accent); }
.date-stamp { font-family: var(--font-display); text-align: center; line-height: 1; border-right: 1px solid var(--line); padding-right: 12px; }
.date-stamp b { display: block; font-size: 1.7rem; }
.date-stamp span { font-size: .8rem; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.round .t { font-weight: 600; }
.round .scores { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 4px; font-size: .88rem; color: var(--muted); }
.round .scores b { color: var(--ink); font-variant-numeric: tabular-nums; }

/* Scorekarte */
.card-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.card { border-collapse: collapse; font-family: var(--font-display); font-variant-numeric: tabular-nums; min-width: 100%; }
table.card th, table.card td { border: 1px solid var(--line); text-align: center; padding: 0; height: 40px; min-width: 40px; font-size: 1rem; }
table.card th { font-weight: 600; background: var(--soft); font-size: .85rem; letter-spacing: .04em; }
table.card .name { text-align: left; padding: 0 10px; min-width: 96px; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: sticky; left: 0; background: var(--surface); z-index: 1; font-family: var(--font-body); font-size: .9rem; font-weight: 600; }
table.card th.name { background: var(--soft); font-family: var(--font-display); font-size: .85rem; text-transform: uppercase; }
table.card tr.par td, table.card tr.si td { color: var(--muted); font-size: .9rem; }
table.card tr.si td { font-size: .78rem; }
table.card td.sum { font-weight: 700; background: var(--soft); min-width: 48px; }
table.card td.pts { font-weight: 700; color: var(--accent); min-width: 44px; }
td.sc { position: relative; }
td.sc input { width: 30px; height: 30px; border: 1.5px solid transparent; background: transparent; text-align: center; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; padding: 0; border-radius: 4px; }
td.sc input::placeholder { color: var(--line); }
td.sc input:focus { background: var(--accent-soft); }
td.sc .dots { position: absolute; top: 2px; right: 3px; font-size: 9px; line-height: 1; color: var(--accent); letter-spacing: -1px; pointer-events: none; }
td.sym-eagle input { border-color: var(--ink); border-radius: 50%; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
td.sym-birdie input { border-color: var(--ink); border-radius: 50%; }
td.sym-bogey input { border-color: var(--ink); border-radius: 2px; }
td.sym-double input { border-color: var(--ink); border-radius: 2px; box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.legend-sym { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); align-items: center; }
.legend-sym i { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); vertical-align: -3px; margin-right: 4px; }
.legend-sym i.c { border-radius: 50%; }

/* Tabellen */
.tbl-wrap { overflow-x: auto; }
table.tbl { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.tbl th, table.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.tbl th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .8rem; color: var(--muted); font-weight: 600; }
table.tbl th:first-child, table.tbl td:first-child { text-align: left; }
table.tbl tr.click { cursor: pointer; }
table.tbl tr.click:hover td { background: var(--soft); }
table.tbl tr.sel td { background: var(--accent-soft); }
.big { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
.kpi b { display: block; font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-family: var(--font-display); }

.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-display); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.distbar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.distbar span { display: block; height: 100%; }
.distleg { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; font-size: .86rem; }
.distleg div { display: flex; gap: 8px; align-items: baseline; }
.distleg i { flex: none; width: 10px; height: 10px; border-radius: 2px; transform: translateY(1px); }
.distleg b { font-variant-numeric: tabular-nums; }
.ptsbar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-left: 6px; }
.tag { display: inline-block; font-size: .72rem; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
.tag.bad { background: var(--d-triple); color: var(--surface); }
.tag.good { background: var(--accent-soft); color: var(--accent); }
.sub { display: grid; gap: 10px; }
.badgewall { display: grid; gap: 14px; }
.bplayer { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.bplayer:last-child { border-bottom: 0; padding-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 6px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; color: var(--surface); background: var(--bc); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--surface) 35%, transparent), 0 0 0 2px var(--bc); }
.badge.off .medal { background: transparent; color: var(--muted); box-shadow: none; border: 2px dashed var(--line); }
.badge b { font-size: .85rem; line-height: 1.2; }
.badge span { font-size: .75rem; color: var(--muted); line-height: 1.3; }
.badge.off b { color: var(--muted); }
.badge.neg { border-color: var(--b-neg); }
.badge .bsub { color: var(--ink); font-size: .74rem; margin-top: -2px; }
.badge.neg .medal { border-radius: 10px; transform: rotate(-6deg); }
.badge.neg.off .medal { border-radius: 10px; }
.empty { text-align: center; padding: 34px 16px; display: grid; gap: 10px; justify-items: center; }
.empty ol { text-align: left; margin: 0; padding-left: 1.2em; color: var(--muted); max-width: 46ch; }

.scanbox { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--bg); }
.scanbox img { max-height: 200px; width: auto; border-radius: 6px; justify-self: start; }
.status { font-size: .9rem; }
.status.err { color: var(--danger); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.map-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 220px); gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.map-row code { display: block; font-size: .8rem; color: var(--muted); overflow-x: auto; white-space: nowrap; }
.map-row select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }

.plist { display: grid; gap: 0; }
.hcp-badge.virt { background: var(--accent-soft); color: var(--accent); }
.pitem { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.pitem .n { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.av { flex: none; display: inline-grid; place-items: center; width: var(--av, 28px); height: var(--av, 28px); border-radius: 50%; overflow: hidden; vertical-align: middle; background: var(--avc, var(--soft)); color: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: calc(var(--av, 28px) * .42); letter-spacing: .02em; box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 2.5px var(--line); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.who b, .who span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmap-block { display: grid; gap: 8px; }
.cmap-wrap { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--m-bg); }
.cmap { display: block; width: 100%; height: auto; }
.cmap .mhole:hover circle { fill: var(--m-label-s) !important; }
.cmap .mhole:hover text { fill: var(--m-label) !important; }
.hmap-wrap { display: grid; place-items: center; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--m-bg); }
.hmap { display: block; height: min(70vh, 640px); max-width: 100%; }
.attr { font-size: .72rem; }
.aerial { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: .9rem; }
.aerial img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb { flex: none; width: 96px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-box { display: grid; gap: 10px; justify-items: start; }
.card-img { width: 100%; max-width: 420px; border-radius: 10px; border: 1px solid var(--line); display: block; }
.thumb svg { width: 100%; height: 100%; display: block; background: var(--m-bg); }
.maplinks { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-edit { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.photo-edit .av { --av: 96px; }
.hcp-badge { font-family: var(--font-display); font-weight: 600; background: var(--soft); padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 16px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
table.card select, table.card input.si { width: 38px; height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); text-align: center; font-family: var(--font-display); font-size: 1rem; padding: 0; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 520px) {
  h1 { font-size: 1.6rem; }
  .map-row { grid-template-columns: 1fr; }
}


/* ---------- Unterseiten, Rundenliste, Runden-Ansicht ---------- */
.subnav { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--soft); width: fit-content; max-width: 100%; overflow-x: auto; }
.subnav button { border: 0; background: none; padding: 7px 16px; border-radius: 8px; font: 600 .95rem var(--font-body); color: var(--muted); cursor: pointer; white-space: nowrap; }
.subnav button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.filters .f { min-width: 140px; flex: 1 1 160px; }
.filters .btn { flex: none; }

<script>
// ---------- Hilfen ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const sum = a => a.reduce((x, y) => x + (+y || 0), 0);
const avg = a => a.length ? sum(a) / a.length : null;
const fit = (a, n) => { const r = (a || []).slice(0, n).map(x => Math.max(0, Math.min(20, parseInt(x, 10) || 0))); while (r.length < n) r.push(0); return r; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmt1 = v => v == null ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtVs = v => v == null ? "–" : (Math.abs(v) < 0.05 ? "±0" : (v > 0 ? "+" : "−") + (Number.isInteger(v) ? Math.abs(v) : fmt1(Math.abs(v))));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "short", year: "numeric" });
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

// ---------- Golf-Rechnung (WHS / DGV) ----------
// Eigener Abschlag je Spieler (z. B. Weiß statt Gelb): überschreibt nur CR und Slope
const teeOf = (e, c) => (e && e.cr != null && e.slope != null) ? { ...c, cr: e.cr, slope: e.slope } : c;
function courseHcp(hi, c) {
  const n = c.pars.length, par = sum(c.pars);
  const h = n <= 9 ? hi / 2 : hi;
  return Math.round(h * (c.slope || 113) / 113 + ((c.cr ?? par) - par));
}
function siRanks(si, n) {
  const v = Array.from({ length: n }, (_, i) => (si && si[i] > 0) ? si[i] : 100 + i);
  const order = v.map((_, i) => i).sort((a, b) => v[a] - v[b] || a - b);
  const r = Array(n); order.forEach((idx, k) => r[idx] = k + 1); return r;
}
function received(rank, ph, n) {
  if (ph >= 0) return Math.floor(ph / n) + ((ph % n) >= rank ? 1 : 0);
  const p = -ph; return -(Math.floor(p / n) + (rank > n - (p % n) ? 1 : 0));
}
// Markierung beim Brutto: * = Striche als Netto-Doppelbogey gewertet, ½ = nur eine Hälfte gespielt
const grossMark = res => res.partial ? "½" : res.strikes ? "*" : "";
// Auf einem 18-Loch-Platz nur eine Hälfte gespielt → für Durchschnitte wie eine 9-Loch-Runde behandeln
const effHoles = res => (res.n === 18 && res.played <= 9) ? 9 : res.n;
function result(e, c) {
  const n = c.pars.length, rk = siRanks(c.si, n), ph = courseHcp(+e.hcp || 0, teeOf(e, c)), strokes = fit(e.strokes, n);
  let gross = 0, parP = 0, pts = 0, played = 0, strikeAdd = 0; const rec = [], hp = [], strikeHoles = [];
  for (let i = 0; i < n; i++) {
    const s = strokes[i], r = received(rk[i], ph, n); rec.push(r);
    const p = s > 0 ? Math.max(0, 2 + c.pars[i] + r - s) : 0; hp.push(p); pts += p;
    if (s > 0) { gross += s; parP += c.pars[i]; played++; }
    else { strikeAdd += c.pars[i] + 2 + Math.max(0, r); strikeHoles.push(i); }
  }
  // Striche: als Netto-Doppelbogey (Par + 2 + Vorgabeschläge) werten, wie beim Handicap (WHS).
  // Ausnahme: nur eine Hälfte einer 18-Loch-Runde gespielt → bleibt eine Teilrunde.
  const half = n === 18 && played <= 9;
  if (!half && strikeHoles.length) { gross += strikeAdd; parP = sum(c.pars); }
  return { gross, played, n, complete: !half && played > 0, strikes: half ? 0 : strikeHoles.length, strikeHoles: half ? [] : strikeHoles, partial: half, vsPar: gross - parP, ph, net: gross - ph, pts, rec, hp };
}
// Jahresfilter: eine Zahl oder "all" für alle Jahre
const inYear = (date, year) => !!date && (year === "all" || date.slice(0, 4) === String(year));
const yearLabel = y => y === "all" ? "Alle Jahre" : String(y);
// Monatsbeschriftung: über mehrere Jahre mit Jahreszahl
const monthLabel = (m, multiYear) => m.toLocaleDateString("de-DE", multiYear ? { month: "short", year: "2-digit" } : { month: "short" });
function yearStats(year) {
  return activePlayers().map(p => {
    const pts = [];
    for (const r of S.rounds) {
      if (!inYear(r.date, year)) continue;
      const c = courseById(r.courseId); if (!c) continue;
      for (const e of r.entries || []) {
        if (e.playerId !== p.id) continue;
        const res = result(e, c);
        const vh = virtualHI(p.id, r.date, r.id).hi, vres = result({ ...e, hcp: vh ?? e.hcp }, c);
        pts.push({ date: r.date, course: c.name, n: effHoles(res), gross: res.complete ? res.gross : null, vsPar: res.complete ? res.vsPar : null, net: res.complete ? res.net : null, pts: res.pts, roundId: r.id, vpts: vres.pts, vnet: res.complete ? vres.net : null, vhi: vh });
      }
    }
    if (!pts.length) return null;
    pts.sort((a, b) => a.date < b.date ? -1 : 1);
    const r18 = pts.filter(x => x.n === 18);
    const f18 = r18.filter(x => x.gross != null);
    const g = f18.map(x => x.gross);
    return {
      player: p, points: pts, rounds: pts.length, full: f18.length,
      avgGross: avg(g), bestGross: g.length ? Math.min(...g) : null,
      avgVs: avg(f18.map(x => x.vsPar)), avgNet: avg(f18.map(x => x.net)),
      nine: pts.filter(x => x.n !== 18).length,
      avgPts: avg(r18.map(x => x.pts)), bestPts: r18.length ? Math.max(...r18.map(x => x.pts)) : null, totalPts: sum(pts.map(x => x.pts)),
      avgVPts: avg(r18.map(x => x.vpts)), bestVPts: r18.length ? Math.max(...r18.map(x => x.vpts)) : null, totalVPts: sum(pts.map(x => x.vpts)),
      avgVNet: avg(f18.map(x => x.vnet)), virtual: virtualHI(p.id)
    };
  }).filter(Boolean).sort((a, b) => state.scoring === "virt" ? (b.avgVPts ?? 0) - (a.avgVPts ?? 0) : (b.avgPts ?? 0) - (a.avgPts ?? 0));
}

// ---------- Virtuelles Handicap (WHS-Logik aus den erfassten Runden) ----------
// Score-Differential = 113 / Slope × (bereinigtes Brutto − Course Rating).
// Bereinigt: je Loch höchstens Netto-Doppelbogey (Par + 2 + Vorgabeschläge); Strich zählt als Netto-Doppelbogey.
// 18-Loch-Runden zählen ab 14 gespielten Löchern. 9-Loch-Runden (9-Loch-Platz oder nur vorne/hinten gespielt)
// werden nach WHS 2024 ergänzt: 9-Loch-Differential + erwartetes 9-Loch-Differential (0,52 × HCP + 1,2).
function scoreDifferential(e, c) {
  const n = c.pars.length; if (n !== 18) return null;
  const strokes = fit(e.strokes, n);
  if (strokes.filter(s => s > 0).length < 14) return null;
  const t = teeOf(e, c), rk = siRanks(c.si, n), ph = courseHcp(+e.hcp || 0, t);
  let ags = 0;

// WHS-Tabelle: wie viele der besten Differentials zählen (aus den letzten 20) und welche Korrektur gilt
function hiFromDiffs(d) {

// Virtuelles HCP eines Spielers aus allen Runden vor einem Datum (ohne die Runde selbst)

// 9-Loch-Differential (bezogen auf 9 Löcher) oder null
function nineHoleDiff(e, c) {

  const sub = { pars: idx.map(i => c.pars[i]), si: idx.map(i => c.si[i]), cr, slope };
  const rk = siRanks(sub.si, 9), ph = courseHcp(+e.hcp || 0, sub);

  idx.forEach((i, k) => { const cap = sub.pars[k] + 2 + received(rk[k], ph, 9); ags += st[i] > 0 ? Math.min(st[i], cap) : cap; });

}
const expected9 = hi => 0.52 * Math.max(0, hi) + 1.2;
function playerDiffs(pid, beforeDate = "9999-12-31", excludeId = null) {
  const ds = [];
  [...S.rounds].filter(r => r.date && r.date < beforeDate && r.id !== excludeId)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.updatedAt || 0) - (b.updatedAt || 0))
    .forEach(r => {
      const c = courseById(r.courseId); if (!c) return;
      (r.entries || []).forEach(e => {
        if (e.playerId !== pid) return;
        let d = scoreDifferential(e, c);

// ---------- Order of Merit ----------
// Jede Runde mit mindestens 2 Spielern ist ein Duell zwischen allen Beteiligten (nach Stableford):
// Sieg gegen einen Mitspieler = 1 Duellpunkt, Gleichstand = ½. Rundensieg = höchste Punktzahl der Runde.
function meritStats(year, virt) {
  const tbl = {}, h2h = {};
  for (const r of S.rounds) {
    if (!inYear(r.date, year)) continue;
    const c = courseById(r.courseId); if (!c) continue;
    const es = (r.entries || []).filter(e => activeId(e.playerId)); if (es.length < 2) continue;
    const sc = es.map(e => {
      const hcp = virt ? (virtualHI(e.playerId, r.date, r.id).hi ?? e.hcp) : e.hcp;
      return { pid: e.playerId, v: result({ ...e, hcp }, c).pts };
    });
    const top = Math.max(...sc.map(x => x.v));
    sc.forEach(a => {
      const t = tbl[a.pid] ||= { pid: a.pid, rounds: 0, wins: 0, duel: 0, games: 0, place: 0 };
      const better = sc.filter(b => b.v > a.v).length, tied = sc.filter(b => b !== a && b.v === a.v).length;
      t.rounds++; t.place += 1 + better; t.games += sc.length - 1;
      t.duel += (sc.length - 1 - better - tied) + tied / 2;
      if (a.v === top) t.wins++;
      sc.forEach(b => {
        if (b === a) return;
        const h = h2h[a.pid + "|" + b.pid] ||= { w: 0, t: 0, l: 0 };
        if (a.v > b.v) h.w++; else if (a.v === b.v) h.t++; else h.l++;
      });
    });
  }
  const rows = Object.values(tbl).sort((x, y) => y.duel - x.duel || y.wins - x.wins || x.place / x.rounds - y.place / y.rounds);
  return { rows, h2h };
}
function meritHTML(V, year = state.year) {
  const m = meritStats(year, V);
  if (!m.rows.length) return "";
  const fmtHalf = v => Number.isInteger(v) ? String(v) : v.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  let h = `<section class="panel"><h3>Order of Merit · ${V ? "virtuelles" : "offizielles"} HCP</h3>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Platz</th><th>Spieler</th><th>Runden</th><th>Rundensiege</th><th>Duellpunkte</th><th>Duell-Quote</th><th>Ø Platz</th></tr></thead><tbody>
    ${m.rows.map((r, i) => `<tr><td class="big">${i + 1}.</td><td>${who(r.pid)}</td><td>${r.rounds}</td><td>${r.wins}</td><td class="big">${fmtHalf(r.duel)}</td><td>${Math.round(r.duel / r.games * 100)} %</td><td>${fmt1(r.place / r.rounds)}</td></tr>`).join("")}
    </tbody></table></div>`;
  const ps = m.rows.map(r => r.pid);
  if (ps.length >= 2) {
    h += `<h3>Duell-Bilanz</h3><div class="tbl-wrap"><table class="tbl matrix"><thead><tr><th>Zeile gegen Spalte</th>${ps.map(pid => `<th>${esc(pName(pid))}</th>`).join("")}</tr></thead><tbody>
      ${ps.map(a => `<tr><td><b>${esc(pName(a))}</b></td>${ps.map(b => {
        if (a === b) return `<td class="hint">–</td>`;
        const x = m.h2h[a + "|" + b];
        if (!x) return `<td class="hint">nie</td>`;
        const col = x.w > x.l ? "var(--accent)" : x.w < x.l ? "var(--danger)" : "var(--muted)";
        return `<td><b style="color:${col}">${x.w}</b> : ${x.l}${x.t ? ` <span class="hint">(${x.t} U)</span>` : ""}</td>`;
      }).join("")}</tr>`).join("")}
      </tbody></table></div>`;
  }
  return h + `<p class="hint">Gewertet werden alle Runden mit mindestens zwei Spielern, nach Stableford-Punkten. Jeder geschlagene Mitspieler bringt einen Duellpunkt, ein Gleichstand einen halben. Bilanz: Siege : Niederlagen (U = unentschieden), gelesen aus Sicht der Zeile. Jahr und Wertung oben gelten für beide Tabellen und sind mit der Statistik verknüpft.</p></section>`;
}

const BADGES = [
  { id: "u110", label: "Unter 110", short: "<110", tier: "copper", desc: "18-Loch-Runde mit weniger als 110 Schlägen", test: x => x.full && x.gross < 110 },
  { id: "u100", label: "Unter 100", short: "<100", tier: "bronze", desc: "18-Loch-Runde mit weniger als 100 Schlägen", test: x => x.full && x.gross < 100 },
  { id: "u90", label: "Unter 90", short: "<90", tier: "silver", desc: "18-Loch-Runde mit weniger als 90 Schlägen", test: x => x.full && x.gross < 90 },
  { id: "u80", label: "Unter 80", short: "<80", tier: "gold", desc: "18-Loch-Runde mit weniger als 80 Schlägen", test: x => x.full && x.gross < 80 },
  { id: "p40", label: "40+ Punkte", short: "40+", tier: "green", desc: "Mindestens 40 Stableford-Punkte in einer 18-Loch-Runde", test: x => x.n18 && x.pts >= 40 },
  { id: "birdie", label: "Birdie", short: "−1", tier: "silver", desc: "Ein Loch einen Schlag unter Par (zählt jedes Birdie)", test: x => x.birdies },
  { id: "eagle", label: "Eagle", short: "−2", tier: "gold", desc: "Ein Loch zwei Schläge unter Par, z. B. eine 3 auf Par 5 oder ein Ass auf Par 3", test: x => x.eagles },
  { id: "par3", label: "3 Pars in Reihe", short: "3×P", tier: "green", desc: "Drei Löcher hintereinander Par oder besser", test: x => x.streak >= 3 },
  { id: "666", label: "666", sub: "3× Doppelbogey in Folge", short: "666", tier: "neg", neg: true, desc: "Negativ-Badge: drei Doppelbogeys hintereinander (zählt jedes Mal)", test: x => x.triple2 },
  { id: "r20", label: "20 Runden", short: "20", tier: "silver", desc: "20 gespielte Runden (9 oder 18 Loch)", milestone: 20 },
  { id: "r50", label: "50 Runden", short: "50", tier: "gold", desc: "50 gespielte Runden (9 oder 18 Loch)", milestone: 50 }
];
// Wertet alle Runden eines Spielers aus (alle Jahre): wie oft und wann zuerst erreicht
function playerBadges(pid, year = "all") {
  const out = Object.fromEntries(BADGES.map(b => [b.id, { count: 0, first: null, course: null, firstEver: null }]));
  let played = 0;
  [...S.rounds].filter(r => r.date).sort((a, b) => a.date.localeCompare(b.date)).forEach(r => {
    const c = courseById(r.courseId); if (!c) return;
    (r.entries || []).forEach(e => {
      if (e.playerId !== pid) return;
      const res = result(e, c), st = fit(e.strokes, c.pars.length);
      let run = 0, streak = 0, run2 = 0, triple2 = 0;
      st.forEach((v, i) => {
        run = v > 0 && v <= c.pars[i] ? run + 1 : 0; streak = Math.max(streak, run);
        run2 = v > 0 && v - c.pars[i] === 2 ? run2 + 1 : 0;
        if (run2 === 3) { triple2++; run2 = 0; }
      });
      const diffs = st.map((v, i) => v > 0 ? v - c.pars[i] : null);
      const info = { full: c.pars.length === 18 && res.complete, n18: c.pars.length === 18, gross: res.gross, pts: res.pts, streak, triple2,
        birdies: diffs.filter(d => d === -1).length, eagles: diffs.filter(d => d === -2).length, };
      played++;
      if (info.full) out.bestGross = Math.min(out.bestGross ?? Infinity, res.gross);
      if (info.n18 && res.complete) out.bestPts = Math.max(out.bestPts ?? 0, res.pts);
      out.bestStreak = Math.max(out.bestStreak ?? 0, streak);
      const counts = inYear(r.date, year);
      BADGES.forEach(b => {
        const o = out[b.id];
        if (b.milestone) { if (played === b.milestone) { o.firstEver = r.date; if (counts) Object.assign(o, { count: 1, first: r.date, course: c.name }); } return; }
        const k = +b.test(info); if (!k) return;
        if (!o.firstEver) o.firstEver = r.date;
        if (!counts) return;
        o.count += k; if (!o.first) { o.first = r.date; o.course = c.name; } });
    });
  });
  out.played = played;
  return out;
}
// Wie weit ist es bis zu einem offenen Badge?
function badgeProgress(b, pb) {
  const thr = { u110: 110, u100: 100, u90: 90, u80: 80 }[b.id];
  if (thr) return pb.bestGross != null ? `Bestes Brutto ${pb.bestGross} – noch ${pb.bestGross - thr + 1} Schl${pb.bestGross - thr + 1 === 1 ? "ag" : "äge"}` : "Noch keine vollständige 18-Loch-Runde";
  if (b.id === "p40") return pb.bestPts != null ? `Beste Runde ${pb.bestPts} Punkte – noch ${40 - pb.bestPts}` : "Noch keine 18-Loch-Runde";
  if (b.id === "par3") return `Längste Serie bisher: ${pb.bestStreak || 0} × Par oder besser`;
  if (b.milestone) return `${pb.played} von ${b.milestone} Runden`;

}

}

// ---------- Saisonrückblick ----------
function seasonReview(year) {
  const rounds = S.rounds.filter(r => inYear(r.date, year) && courseById(r.courseId)).sort((a, b) => a.date.localeCompare(b.date));
  const courseIds = new Set(rounds.map(r => r.courseId));
  const pids = [...new Set(rounds.flatMap(r => (r.entries || []).map(e => e.playerId)))].filter(pid => activeId(pid));
  const nextYear = year === "all" ? "9999-12-31" : (year + 1) + "-01-01";
  const startDate = year === "all" ? "0000-01-01" : year + "-01-01";
  let bestG = null, bestP = null, birdies = 0, devils = 0;
  const players = pids.map(pid => {
    const pts = [];
    rounds.forEach(r => {
      const c = courseById(r.courseId);
      (r.entries || []).forEach(e => {
        if (e.playerId !== pid) return;
        const res = result(e, c), st = fit(e.strokes, c.pars.length);
        const x = { date: r.date, course: c.name, n: effHoles(res), gross: res.complete ? res.gross : null, pts: res.pts };
        pts.push(x);
        if (x.n === 18 && x.gross != null && (!bestG || x.gross < bestG.gross)) bestG = { ...x, pid };
        if (x.n === 18 && (!bestP || x.pts > bestP.pts)) bestP = { ...x, pid };
        birdies += st.filter((v, i) => v > 0 && v - c.pars[i] === -1).length;
      });
    });
    const r18 = pts.filter(x => x.n === 18), g18 = r18.filter(x => x.gross != null);
    const half = Math.floor(r18.length / 2);
    const pb = playerBadges(pid, year);
    devils += pb["666"].count;
    const earned = BADGES.filter(b => pb[b.id].count).map(b => ({ b, count: pb[b.id].count, isNew: year !== "all" && pb[b.id].firstEver && pb[b.id].firstEver.slice(0, 4) === String(year) }));
    return {
      pid, name: pName(pid), rounds: pts.length,
      avgPts: avg(r18.map(x => x.pts)), avgGross: avg(g18.map(x => x.gross)),
      bestGross: g18.length ? g18.reduce((a, b) => b.gross < a.gross ? b : a) : null,
      bestPts: r18.length ? r18.reduce((a, b) => b.pts > a.pts ? b : a) : null,
      firstHalf: half >= 2 ? avg(r18.slice(0, half).map(x => x.pts)) : null, secondHalf: half >= 2 ? avg(r18.slice(half).map(x => x.pts)) : null,
      hiStart: hiFromDiffs(playerDiffs(pid, startDate).slice(-20)), hiEnd: hiFromDiffs(playerDiffs(pid, nextYear).slice(-20)),
      earned
    };
  }).sort((a, b) => (b.avgPts ?? 0) - (a.avgPts ?? 0));
  return { year, rounds, courses: courseIds.size, players, bestG, bestP, birdies, devils, merit: meritStats(year, false) };
}

// ---------- Spieler-Analyse ----------
const DIST = [["eagle", "Eagle o. besser"], ["birdie", "Birdie"], ["par", "Par"], ["bogey", "Bogey"], ["double", "Doppelbogey"], ["triple", "Triple +"], ["strich", "Strich"]];
function playerAnalysis(pid, year) {
  const dist = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0, strich: 0 }, byPar = {}, fb = [], courses = {};
  for (const r of S.rounds) {
    if (!inYear(r.date, year)) continue;
    const c = courseById(r.courseId); if (!c) continue;
    for (const e of r.entries || []) {
      if (e.playerId !== pid) continue;
      const res = result(e, c), st = fit(e.strokes, c.pars.length);
      st.forEach((v, i) => {
        const par = c.pars[i];
        if (!v) { dist.strich++; return; }
        const d = v - par;
        dist[d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "par" : d === 1 ? "bogey" : d === 2 ? "double" : "triple"]++;
        (byPar[par] ||= []).push({ d, p: res.hp[i] });
      });
      if (c.pars.length === 18 && res.complete) fb.push({
        date: r.date, course: c.name,
        f: sum(st.slice(0, 9)) - sum(c.pars.slice(0, 9)), b: sum(st.slice(9)) - sum(c.pars.slice(9)),
        fp: sum(res.hp.slice(0, 9)), bp: sum(res.hp.slice(9))
      });
      const cc = courses[c.id] ||= { c, rounds: 0, holes: c.pars.map(() => ({ s: [], p: [] })) };
      cc.rounds++;
      st.forEach((v, i) => { if (v > 0) cc.holes[i].s.push(v); cc.holes[i].p.push(res.hp[i]); });
    }
  }
  return { dist, byPar, fb, courses };
}
function hiTimeline(pid, year) {
  const dates = [...new Set(S.rounds.filter(r => inYear(r.date, year) && (r.entries || []).some(e => e.playerId === pid)).map(r => r.date))].sort();
  return dates.map(d => ({ date: d, hi: hiFromDiffs(playerDiffs(pid, d + "z").slice(-20)) })).filter(x => x.hi != null);
}

// ---------- Rekorde, Formkurve, Platzvergleich ----------
// Kennzahlen je gespielter Runde und Spieler (für Rekorde und Platzvergleich)
function roundFacts(year, pid = null) {
  const out = [];
  for (const r of S.rounds) {
    if (!inYear(r.date, year)) continue;
    const c = courseById(r.courseId); if (!c) continue;
    for (const e of r.entries || []) {
      if (!activeId(e.playerId) || (pid && e.playerId !== pid)) continue;
      const res = result(e, c), st = fit(e.strokes, c.pars.length), n = c.pars.length;
      let run = 0, streak = 0, pars = 0, birdies = 0;
      st.forEach((v, i) => {
        const d = v - c.pars[i];
        run = v > 0 && d <= 1 ? run + 1 : 0; streak = Math.max(streak, run);
        if (v > 0 && d === 0) pars++;
        if (v > 0 && d < 0) birdies++;
      });
      const halves = n === 18 ? [sum(res.hp.slice(0, 9)), sum(res.hp.slice(9))] : n === 9 ? [res.pts] : [];
      const halfPlayed = n === 18 ? [st.slice(0, 9).filter(v => v > 0).length >= 7, st.slice(9).filter(v => v > 0).length >= 7] : [true];
      const best9 = Math.max(-1, ...halves.filter((_, i) => halfPlayed[i]));
      const eff = effHoles(res);
      out.push({
        pid: e.playerId, roundId: r.id, date: r.date, cId: c.id, course: c.name, n: eff,
        gross: eff === 18 && res.complete ? res.gross : null, vsPar: eff === 18 && res.complete ? res.vsPar : null,
        pts: res.pts, pts18: eff === 18 ? res.pts : null, perHole: res.pts / Math.max(1, eff),
        diff: scoreDifferential(e, c) ?? (() => { const d9 = nineHoleDiff(e, c); return d9 != null ? d9 * 2 : null; })(),
        best9: best9 >= 0 ? best9 : null, streak, pars, birdies, strikes: res.strikes
      });
    }
  }
  return out;
}
const RECORDS = [
  { key: "gross", label: "Beste Bruttorunde (18 Loch)", dir: -1, fmt: f => `${f.gross} (${fmtVs(f.vsPar)})` },
  { key: "pts18", label: "Meiste Stableford-Punkte (18 Loch)", dir: 1, fmt: f => `${f.pts18} Punkte` },
  { key: "best9", label: "Meiste Punkte auf 9 Löchern", dir: 1, fmt: f => `${f.best9} Punkte` },
  { key: "diff", label: "Bestes Score-Differential", dir: -1, fmt: f => fmt1(f.diff), hint: "auf 18 Loch hochgerechnet bei 9-Loch-Runden" },
  { key: "streak", label: "Längste Serie ohne Doppelbogey", dir: 1, fmt: f => `${f.streak} Löcher`, min: 2 },
  { key: "pars", label: "Meiste Pars in einer Runde", dir: 1, fmt: f => `${f.pars} Pars`, min: 1 },
  { key: "birdies", label: "Meiste Birdies in einer Runde", dir: 1, fmt: f => `${f.birdies} Birdie${f.birdies === 1 ? "" : "s"}`, min: 1 }
];
function records(facts) {
  return RECORDS.map(R => {
    const vals = facts.filter(f => f[R.key] != null && (R.min == null || f[R.key] >= R.min));
    if (!vals.length) return { R, holders: [] };
    const best = R.dir > 0 ? Math.max(...vals.map(f => f[R.key])) : Math.min(...vals.map(f => f[R.key]));
    const eq = (a, b) => Math.abs(a - b) < 1e-9;
    return { R, best, holders: vals.filter(f => eq(f[R.key], best)).sort((a, b) => a.date.localeCompare(b.date)) };
  });
}
function courseRecords(facts) {
  const by = {};
  facts.forEach(f => (by[f.cId] ||= []).push(f));
  return Object.entries(by).map(([cId, fs]) => {
    const g = fs.filter(f => f.gross != null), p18 = fs.filter(f => f.n === 18), all = fs;
    const bestG = g.length ? Math.min(...g.map(f => f.gross)) : null;
    const bestP = all.length ? Math.max(...all.map(f => f.pts)) : null;
    return { cId, course: fs[0].course, n: courseById(cId)?.pars.length || fs[0].n, rounds: new Set(fs.map(f => f.roundId)).size,
      gross: bestG, grossBy: g.filter(f => f.gross === bestG), pts: bestP, ptsBy: all.filter(f => f.pts === bestP) };
  }).sort((a, b) => b.rounds - a.rounds || a.course.localeCompare(b.course, "de"));
}
const holderNames = hs => [...new Set(hs.map(h => pName(h.pid)))].join(", ");
const holderWhere = hs => hs.length === 1 ? `${esc(hs[0].course)} · ${fmtDate(hs[0].date)}` : `${hs.length}× erreicht`;

// Formkurve: gleitender Schnitt der letzten 5 Runden (18 Loch) gegen den Schnitt im Zeitraum
function formOf(points, key = "pts") {
  const r = points.filter(p => p.n === 18);
  if (r.length < 3) return null;
  const last = r.slice(-5), lastAvg = avg(last.map(p => p[key])), all = avg(r.map(p => p[key]));
  const delta = lastAvg - all;
  return { lastAvg, all, delta, n: last.length, trend: delta >= 1 ? "up" : delta <= -1 ? "down" : "flat" };
}
function formBadge(f) {
  if (!f) return `<span class="hint">–</span>`;
  const sym = f.trend === "up" ? "▲" : f.trend === "down" ? "▼" : "►";
  const col = f.trend === "up" ? "var(--accent)" : f.trend === "down" ? "var(--danger)" : "var(--muted)";
  return `<span title="Ø letzte ${f.n}: ${fmt1(f.lastAvg)} · Ø gesamt: ${fmt1(f.all)}" style="color:${col};font-weight:700;white-space:nowrap">${sym} ${f.delta >= 0 ? "+" : "−"}${fmt1(Math.abs(f.delta))}</span>`;
}
function formChartSVG(points, key) {
  const r = points.filter(p => p.n === 18);
  const W = 640, H = 220, L = 34, R = 14, T = 14, B = 28;
  const vals = r.map(p => p[key]);
  const roll = r.map((_, i) => avg(r.slice(Math.max(0, i - 4), i + 1).map(p => p[key])));
  const lo = Math.max(0, Math.floor((Math.min(...vals) - 3) / 6) * 6), hi = Math.ceil((Math.max(...vals) + 3) / 6) * 6;
  const x = i => L + (r.length === 1 ? 0.5 : i / (r.length - 1)) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let v = lo; v <= hi; v += 6) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const mean = avg(vals);
  g += `<line x1="${L}" x2="${W - R}" y1="${y(mean)}" y2="${y(mean)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  if (lo <= 36 && hi >= 36) g += `<text x="${L + 4}" y="${y(36) - 4}" text-anchor="start" style="font-size:11px">36 Punkte</text><line x1="${L}" x2="${W - R}" y1="${y(36)}" y2="${y(36)}" stroke="var(--line)" stroke-width="2"/>`;
  r.forEach((p, i) => g += `<circle cx="${x(i)}" cy="${y(p[key])}" r="3.2" fill="var(--muted)" opacity=".55"><title>${fmtDate(p.date)} · ${esc(p.course)}: ${p[key]} Punkte</title></circle>`);
  g += `<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" points="${roll.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`;
  const li = roll.length - 1;
  g += `<circle cx="${x(li)}" cy="${y(roll[li])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text x="${x(li) - 8}" y="${y(roll[li]) - 10}" text-anchor="end" style="fill:var(--ink);font-weight:700">${fmt1(roll[li])}</text>`;
  [0, Math.floor(li / 2), li].filter((v, i, a) => a.indexOf(v) === i).forEach(i => g += `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === li ? "end" : "middle"}">${new Date(r[i].date + "T12:00:00").toLocaleDateString("de-DE", { month: "short", year: "2-digit" })}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Formkurve: gleitender Schnitt der Stableford-Punkte">${g}</svg>`;
}

// Platzvergleich: Ø Punkte je Platz (auf 18 Loch normiert), Ø Brutto, Ø Differential, Bestleistungen
function courseCompareHTML(pid, year, hcp) {
  const facts = roundFacts(year, pid);
  const by = {};
  facts.forEach(f => (by[f.cId] ||= []).push(f));
  const rows = Object.values(by).map(fs => {
    const g = fs.filter(f => f.gross != null), d = fs.filter(f => f.diff != null);
    return { course: fs[0].course, n: courseById(fs[0].cId)?.pars.length || fs[0].n, rounds: fs.length, ph18: avg(fs.map(f => f.perHole * 18)),
      gross: avg(g.map(f => f.gross)), vs: avg(g.map(f => f.vsPar)), diff: avg(d.map(f => f.diff)),
      bestG: g.length ? Math.min(...g.map(f => f.gross)) : null, bestP: Math.max(...fs.map(f => f.pts)) };
  }).sort((a, b) => b.ph18 - a.ph18);
  if (!rows.length) return "";

    ${rows.map(r => `<tr><td>${esc(r.course)}${r.n === 9 ? " (9)" : ""}</td><td>${r.rounds}</td>
      <td style="white-space:nowrap"><b>${fmt1(r.ph18)}</b><span class="ptsbar" style="width:${Math.round(r.ph18 / maxP * 90)}px;${r.ph18 < 36 ? "background:var(--muted)" : ""}"></span></td>
      <td>${fmt1(r.gross)}</td><td>${fmtVs(r.vs)}</td><td>${fmt1(r.diff)}</td><td>${r.bestG ?? "–"}</td><td>${r.bestP}</td></tr>`).join("")}
    </tbody></table></div>

  </section>`;
}

function hiChartSVG(tl, official) {
  const W = 640, H = 200, L = 34, R = 40, T = 14, B = 26;
  const vals = tl.map(x => x.hi).concat([official]);
  const lo = Math.floor(Math.min(...vals) / 2) * 2 - 2, hi = Math.ceil(Math.max(...vals) / 2) * 2 + 2;
  const ts = tl.map(x => new Date(x.date + "T12:00:00").getTime());
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 - t0 < 864e5 * 14) { t0 -= 864e5 * 10; t1 += 864e5 * 10; }
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  const step = (hi - lo) > 16 ? 4 : 2;
  for (let v = lo; v <= hi; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y(official)}" y2="${y(official)}" stroke="var(--muted)" stroke-dasharray="4 4"/>`;
  const d0 = new Date(t0), months = [];
  for (let d = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); d.getTime() <= t1; d.setMonth(d.getMonth() + 1)) months.push(new Date(d));
  const multi = new Date(t0).getFullYear() !== new Date(t1).getFullYear(), mstep = Math.ceil(months.length / 6) || 1;
  months.forEach((m, i) => { if (i % mstep) return; const xx = x(m.getTime()); g += `<text x="${xx}" y="${H - 6}" text-anchor="middle">${monthLabel(m, multi)}</text>`; });
  const pts = tl.map((p, i) => [x(ts[i]), y(p.hi)]);
  if (pts.length > 1) g += `<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
  pts.forEach((p, i) => g += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>${fmtDate(tl[i].date)}: ${fmt1(tl[i].hi)}</title></circle>`);
  const last = pts[pts.length - 1];
  g += `<text x="${last[0] + 8}" y="${last[1] + 4}" style="fill:var(--ink);font-weight:700">${fmt1(tl[tl.length - 1].hi)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des virtuellen Handicaps">${g}</svg>`;
}

// ---------- Prognose ----------
// Erwarteter Score = Course Rating + Ø Differential der letzten bis zu 10 Runden × Slope / 113 (9 Loch: halbes Differential).
// "Gute Runde" nutzt das virtuelle HCP (Basis: beste Runden). Stableford-Schätzung: 36 (bzw. 18) − (Brutto − Par − Spielvorgabe).
function forecast(p, c) {
  const n = c.pars.length, k = n === 18 ? 1 : 0.5, par = sum(c.pars), cr = c.cr ?? par, sl = c.slope || 113, base = n === 18 ? 36 : 18;
  const hist = [];
  S.rounds.forEach(r => { if (r.courseId !== c.id) return; (r.entries || []).forEach(e => { if (e.playerId !== p.id) return; const res = result(e, c); hist.push(res); }); });
  const full = hist.filter(x => x.complete);
  const histInfo = { count: hist.length, avgGross: avg(full.map(x => x.gross)), avgPts: avg(hist.map(x => x.pts)) };
  const ds = playerDiffs(p.id).slice(-20);
  if (!ds.length) return { none: true, hist: histInfo };
  const avgD = avg(ds.slice(-10)), v = hiFromDiffs(ds);
  const exp = cr + avgD * k * sl / 113;
  const good = v != null ? cr + v * k * sl / 113 : null;
  const ph = courseHcp(+p.hcp || 0, c), vph = v != null ? courseHcp(v, c) : null;
  return {
    exp: Math.round(exp), vsPar: Math.round(exp) - par, good: good != null ? Math.round(good) : null,
    stb: Math.max(0, Math.round(base - (exp - par - ph))), vstb: vph != null ? Math.max(0, Math.round(base - (exp - par - vph))) : null,
    ph, vph, rounds: ds.length, hist: histInfo
  };
}

    </tbody></table></div>
    <p class="hint">Erwartet: Course Rating plus der Schnitt deiner letzten bis zu 10 Score-Differentials, umgerechnet mit dem Slope dieses Platzes. Gute Runde: Score auf Höhe des virtuellen Handicaps. Stableford geschätzt mit dem offiziellen bzw. virtuellen Handicap; durch die Streichung schlechter Löcher fällt das echte Ergebnis oft 1–2 Punkte besser aus.</p>

// Briefing-Daten für einen Spieler auf einem Platz (für Seite und PDF)
function briefingData(c, p) {
  const n = c.pars.length, rk = siRanks(c.si, n), ph = courseHcp(+p.hcp || 0, c), v = virtualHI(p.id).hi, vph = v != null ? courseHcp(v, c) : null;
  const A = playerAnalysis(p.id, "all"), here = A.courses[c.id], f = forecast(p, c);
  const holeAvg = i => here && here.holes[i].s.length ? avg(here.holes[i].s) : null;
  const holePts = i => here && here.holes[i].p.length ? avg(here.holes[i].p) : null;
  const parAvg = k => A.byPar[k]?.length ? avg(A.byPar[k].map(y => y.d)) : null;
  const allP = here ? avg(here.holes.map((_, i) => holePts(i)).filter(x => x != null)) : null;
  const ranked = here ? c.pars.map((_, i) => ({ i, p: holePts(i) })).filter(x => x.p != null).sort((a, b) => a.p - b.p) : [];
  const fear = new Set(ranked.slice(0, 3).filter(x => x.p < allP).map(x => x.i)), strong = new Set(ranked.slice(-3).filter(x => x.p > allP + 0.25).map(x => x.i));
  const word = d => d < 0 ? "Birdie" : (["Par", "Bogey", "Doppelbogey", "Triple"][d] || `+${d}`);
  const tips = [];   // {html, text}
  const tip = (html) => tips.push({ html, text: html.replace(/<[^>]+>/g, "") });
  if (f && !f.none) tip(`Erwartet: rund <b>${f.exp}</b> Schläge (${fmtVs(f.vsPar)}), gute Runde ${f.good ?? "–"}. Für 36 Punkte reichen ${sum(c.pars) + ph} Schläge.`);
  const worstPar = [3, 4, 5].map(k => [k, parAvg(k)]).filter(x => x[1] != null).sort((a, b) => b[1] - a[1])[0];
  if (worstPar) tip(`Auf Par-${worstPar[0]}-Löchern verlierst du im Schnitt am meisten (${fmtVs(worstPar[1])}). Hier hat dieser Platz ${c.pars.filter(x => x === worstPar[0]).length}.`);
  if (A.fb.length >= 3) { const fF = avg(A.fb.map(x => x.f)), fB = avg(A.fb.map(x => x.b)); if (fB - fF >= 0.75) tip(`Hinten spielst du im Schnitt ${fmt1(fB - fF)} Schläge schlechter als vorne – auf den letzten Löchern Konzentration halten.`); else if (fF - fB >= 0.75) tip(`Vorne verlierst du im Schnitt ${fmt1(fF - fB)} Schläge mehr – Aufwärmen lohnt sich.`); }
  if (fear.size) tip(`Angstlöcher hier: ${[...fear].sort((a, b) => a - b).map(i => i + 1).join(", ")} – lieber auf Netto-Par spielen als auf Risiko.`);
  if (!here) tip(`Auf diesem Platz gibt es noch keine Runde; die Lochwerte stützen sich auf den Schnitt je Par-Typ.`);
  const rows = c.pars.map((par, i) => {
    const rec = received(rk[i], ph, n), pa = parAvg(par);
    return { i, par, rk: rk[i], rec, target: par + rec, word: word(rec), ha: holeAvg(i), hp: holePts(i), est: pa != null ? par + pa : null, fear: fear.has(i), strong: strong.has(i) };
  });
  return { c, p, n, ph, v, vph, f, here, tips, rows };
}
function briefingHTML(c) {

  </section>`;

const AV_COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];
function initials(name) { const w = String(name || "?").trim().split(/\s+/); return ((w[0]?.[0] || "?") + (w.length > 1 ? w[w.length - 1][0] : "")).toUpperCase(); }

function loadLocal() {
  try { const raw = localStorage.getItem("golf-scorebuch"); if (raw) Object.assign(S, JSON.parse(raw)); } catch (e) { }
}
function persistLocal() { try { localStorage.setItem("golf-scorebuch", JSON.stringify(S)); } catch (e) { } }

async function save(coll, obj) {
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  if (db) {
    const { id, ...data } = obj;
    try { await db.collection(coll).doc(id).set(data); }
    catch (e) { toast("Speichern fehlgeschlagen. Bitte erneut versuchen."); }
  } else persistLocal();
}
async function removeDoc(coll, id) {
  S[coll] = S[coll].filter(x => x.id !== id);
  if (db) { try { await db.collection(coll).doc(id).delete(); } catch (e) { toast("Löschen fehlgeschlagen."); } }
  else persistLocal();
}

async function initStore() {
  let handle = null;
  try { handle = window.claude?.use ? await claude.use("db") : null; } catch (e) { handle = null; }
  if (handle) {
    db = handle; mode = "db";
    $("#mode").textContent = window.BOGEY_BROWSER ? "Gespeichert in diesem Browser" : "Gespeichert in deinem Claude-Konto";
    let pending = new Set(COLLS);
    COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      pending.delete(c);
      if (!pending.size) { state.ready = true; render(); }
    }, () => { pending.delete(c); state.ready = true; render(); toast("Daten konnten nicht geladen werden."); }));
    db.collection("coursemaps").onSnapshot(snap => {
      for (const k in MAPS) delete MAPS[k];
      snap.docs.forEach(d => { const x = d.data(); try { MAPS[d.id] = x.json ? JSON.parse(x.json) : x; } catch (e) { } });
      if (state.ready) render();
    }, () => { });
  } else {
    mode = "local"; loadLocal(); state.ready = true;
    $("#mode").textContent = "Nur in diesem Browser gespeichert";
    render(true);
  }
}

const TAB_GROUP = { rounds: "rounds", stats: "stats", review: "stats", ranking: "ranking", forecast: "forecast", players: "more", courses: "more", backup: "more", sim: "stats" };
const SUBTABS = { stats: [["stats", "Saison"], ["review", "Rückblick"], ["sim", "Simulator"]], more: [["players", "Spieler"], ["courses", "Plätze"], ["backup", "Backup"]] };
const lastSub = { stats: "stats", more: "players" };
function goTab(t) {

$("#tabs").addEventListener("click", e => {

function subnavHTML() {

}

function render(force) {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === (TAB_GROUP[state.tab] || state.tab))));
  if (!state.ready) return;
  if (editing() && !force) return;   // Eingaben nicht durch Live-Updates überschreiben
  const m = $("#main");
  let html;
  if (state.tab === "rounds") {
    const detail = state.editor ? editorHTML() : state.view && S.rounds.some(r => r.id === state.view) ? roundViewHTML() : "";

      ? `<div class="split"><div class="split-l">${roundsHTML()}</div><div class="split-r">${detail || `<div class="panel empty"><p class="hint">Wähle links eine Runde aus.</p></div>`}</div></div>`
      : detail || roundsHTML();
  }
  else if (state.tab === "stats") html = statsHTML();
  else if (state.tab === "players") html = playersHTML();
  else if (state.tab === "forecast") html = forecastHTML();
  else if (state.tab === "ranking") html = rankingHTML();
  else if (state.tab === "review") html = reviewHTML();
  else if (state.tab === "backup") html = backupHTML();

// Tabellen bekommen Spaltennamen je Zelle (auf dem Handy als Karten gezeigt), leere Kennzahlen fallen weg
function tidyLayout(root) {
  root.querySelectorAll("table.tbl:not(.matrix):not(.stack)").forEach(t => {
    const heads = [...t.querySelectorAll("thead th")].map(th => th.textContent.trim());
    if (!heads.length) return;
    t.classList.add("stack");
    const lead2 = /^platz$/i.test(heads[0]) && /^spieler$/i.test(heads[1] || "");
    t.querySelectorAll("tbody tr").forEach(tr => {
      const tds = [...tr.children];
      tds.forEach((td, i) => { td.dataset.label = heads[i] || ""; if (!td.textContent.trim()) td.classList.add("blank"); });
      if (lead2 && tds[1]) { tds[0].classList.add("mhide"); tds[1].insertAdjacentHTML("afterbegin", `<span class="mplace">${esc(tds[0].textContent.trim())}</span>`); }
    });
  });
  root.querySelectorAll(".kpi").forEach(k => { const v = k.querySelector("b")?.textContent.trim(); if (v === "–" || v === "-" || v === "") k.remove(); });
}
// Lange Erklärtexte auf dem Handy auf zwei Zeilen kürzen, mit „mehr“ zum Aufklappen
const mobileMQ = window.matchMedia("(max-width: 640px)");
const wideMQ = window.matchMedia("(min-width: 1100px)");

function compactHints(root) {
  if (!mobileMQ.matches) return;
  root.querySelectorAll("p.hint").forEach(p => {
    if (p.classList.contains("long") || p.textContent.length < 150 || p.closest(".cmap-block, .scanbox, #backup-status")) return;
    p.classList.add("long");
    const b = document.createElement("button"); b.type = "button"; b.className = "hint-more"; b.textContent = "Mehr anzeigen";
    b.addEventListener("click", ev => { ev.stopPropagation(); const o = p.classList.toggle("open"); b.textContent = o ? "Weniger" : "Mehr anzeigen"; });
    p.after(b);

}

// Persönliche Bestleistung: komplette 18-Loch-Runde mit weniger Schlägen als alle früheren des Spielers
function isPersonalBest(r, e) {
  const c = courseById(r.courseId); if (!c || c.pars.length !== 18) return false;
  const res = result(e, c); if (!res.complete) return false;
  let earlier = 0;
  for (const x of S.rounds) {
    if (x.id === r.id || !x.date || x.date > r.date || (x.date === r.date && (x.updatedAt || 0) >= (r.updatedAt || 0))) continue;
    const cx = courseById(x.courseId); if (!cx || cx.pars.length !== 18) continue;
    const ex = (x.entries || []).find(y => y.playerId === e.playerId); if (!ex) continue;
    const rx = result(ex, cx); if (!rx.complete) continue;
    earlier++;
    if (rx.gross <= res.gross) return false;
  }
  return earlier > 0;
}
function roundPlaces(r, c) {
  const rows = (r.entries || []).filter(e => playerById(e.playerId)).map(e => ({ e, p: playerById(e.playerId), res: result(e, c) }))
    .sort((a, b) => b.res.pts - a.res.pts || a.res.gross - b.res.gross);
  rows.forEach((x, i) => { x.place = i && rows[i - 1].res.pts === x.res.pts ? rows[i - 1].place : i + 1; });
  return rows;
}

      : (r.entries || []).map(e => `<span>${esc(pName(e.playerId))}</span>`).join("");

function cardTable(d, c, ro = false) {
  const n = c.pars.length, rk = siRanks(c.si, n);
  const holes = Array.from({ length: n }, (_, i) => i);
  const split = n === 18;
  const cols = idxs => idxs.map(i => `<th>${i + 1}</th>`).join("");
  let h = `<table class="card"><thead><tr><th class="name">Loch</th>`;
  h += split ? cols(holes.slice(0, 9)) + `<th>Out</th>` + cols(holes.slice(9)) + `<th>In</th>` : cols(holes);
  h += `<th>Brutto</th><th>Pkt</th></tr></thead><tbody>`;
  const line = (cls, label, vals, sums) => {
    let r = `<tr class="${cls}"><td class="name">${label}</td>`;
    if (split) r += vals.slice(0, 9).map(v => `<td>${v}</td>`).join("") + `<td class="sum">${sums[0]}</td>` + vals.slice(9).map(v => `<td>${v}</td>`).join("") + `<td class="sum">${sums[1]}</td>`;
    else r += vals.map(v => `<td>${v}</td>`).join("");
    return r + `<td class="sum">${sums[2]}</td><td></td></tr>`;
  };
  h += line("par", "Par", c.pars, [sum(c.pars.slice(0, 9)), sum(c.pars.slice(9)), sum(c.pars)]);
  h += line("si", "Vorgabe", rk, ["", "", ""]);
  d.entries.forEach((e, ri) => {
    e.strokes = fit(e.strokes, n);
    const res = result(e, c);
    const cell = i => {
      const s = e.strokes[i], dots = res.rec[i] > 0 ? "•".repeat(Math.min(res.rec[i], 3)) : "";
      if (ro) return `<td class="sc ro ${symClass(s, c.pars[i])}"><span class="dots">${dots}</span><span class="v">${s || "–"}</span></td>`;
      return `<td class="sc ${symClass(s, c.pars[i])}" data-r="${ri}" data-i="${i}"><span class="dots">${dots}</span><input id="s-${ri}-${i}" inputmode="numeric" maxlength="2" placeholder="·" aria-label="${esc(pName(e.playerId))} Loch ${i + 1}" value="${s || ""}"></td>`;
    };
    h += `<tr data-row="${ri}"><td class="name" title="${esc(pName(e.playerId))}">${esc(pName(e.playerId))}</td>`;
    if (split) h += holes.slice(0, 9).map(cell).join("") + `<td class="sum" data-sum="out">${sum(e.strokes.slice(0, 9))}</td>` + holes.slice(9).map(cell).join("") + `<td class="sum" data-sum="in">${sum(e.strokes.slice(9))}</td>`;
    else h += holes.map(cell).join("");
    h += `<td class="sum" data-sum="tot">${res.gross}</td><td class="pts" data-sum="pts">${res.pts}</td></tr>`;
  });
  return h + `</tbody></table>`;
}
function symClass(s, par) {
  if (!s) return "";
  const d = s - par;
  return d <= -2 ? "sym-eagle" : d === -1 ? "sym-birdie" : d === 1 ? "sym-bogey" : d >= 2 ? "sym-double" : "";
}

}

function onCellInput(inp) {
  const td = inp.closest("td.sc"), ri = +td.dataset.r, i = +td.dataset.i;

async function saveRound() {
  const d = state.editor, c = courseById(d.courseId);
  if (!c || !d.entries.length) return;
  const obj = { id: d.id || uid(), date: d.date || today(), courseId: d.courseId, entries: d.entries.map(e => ({ playerId: e.playerId, hcp: +e.hcp || 0, strokes: fit(e.strokes, c.pars.length), ...(e.cr != null && e.slope != null ? { cr: e.cr, slope: e.slope, tee: e.tee || "" } : {}) })), updatedAt: Date.now() };
  await save("rounds", obj);
  toast("Runde gesichert");
  state.editor = null; state.scan = null; state.view = obj.id; render(true); window.scrollTo(0, 0);
}

function guessPlayer(name, used) {
  const n = (name || "").toLowerCase().trim(); if (!n) return "";
  const first = n.split(/\s+/)[0];
  const hit = S.players.find(p => !used.has(p.id) && (p.name.toLowerCase() === n || p.name.toLowerCase().split(/\s+/)[0] === first || (first.length >= 3 && p.name.toLowerCase().startsWith(first.slice(0, 3)))));
  return hit ? hit.id : "";
}

function mappingHTML(r) {
  const d = state.editor, used = new Set();
  const nHoles = r.par.length || r.players[0]?.strokes.length || 18;
  let h = `<div style="display:grid;gap:6px"><h3>Erkannt</h3><p class="hint">${r.course ? `Platz „${esc(r.course)}“ · ` : ""}${nHoles} Löcher${r.date ? ` · ${fmtDate(r.date)}` : ""} · ${r.players.length} Spielerzeile(n)</p>`;
  r.players.forEach((p, i) => {
    const g = guessPlayer(p.name, used); if (g) used.add(g);
    h += `<div class="map-row"><div><b>${esc(p.name || "Ohne Namen")}</b><code>${p.strokes.map(s => s || "–").join(" ")}</code></div>
      <select id="map-${i}" aria-label="Zuordnung für ${esc(p.name)}">
        <option value="">Ignorieren</option>
        ${S.players.map(x => `<option value="${x.id}" ${x.id === g ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
        ${p.name ? `<option value="new" ${g ? "" : "selected"}>Neu anlegen: ${esc(p.name)}</option>` : ""}
      </select></div>`;
  });
  const c = courseById(d.courseId);
  if (r.par.length) {
    if (c) h += `<label class="check"><input type="checkbox" id="map-course-update" ${c.pars.every(x => x === 4) ? "checked" : ""}> Par und Lochvorgaben aus dem Foto in „${esc(c.name)}“ übernehmen</label>`;
    else h += `<label class="check"><input type="checkbox" id="map-course-new" checked> Neuen Platz „${esc(r.course || "Neuer Platz")}“ aus dem Foto anlegen (CR und Slope danach unter „Plätze“ ergänzen)</label>`;
  }
  if (r.date) h += `<label class="check"><input type="checkbox" id="map-date" ${d.id ? "" : "checked"}> Datum ${fmtDate(r.date)} übernehmen</label>`;
  h += `<div class="row"><button class="btn primary" data-act="apply-scan">Übernehmen</button><button class="btn ghost" data-act="discard-scan">Verwerfen</button></div></div>`;
  return h;
}

async function prepareImage(file) {
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(res => cv.toBlob(res, "image/jpeg", 0.85));
    return { blob: blob || file, preview: cv.toDataURL("image/jpeg", 0.5) };
  } catch (e) { return { blob: file, preview: null }; }
}

// ---------- PDF (pdf.js, wird erst bei Bedarf geladen) ----------
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLibPromise = null;
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
function getPdfLib() {
  // Der Worker läuft im Hauptthread (globalThis.pdfjsWorker), da fremde Worker-Skripte blockiert sind
  pdfLibPromise ??= loadScript(PDFJS + "pdf.worker.min.js").then(() => loadScript(PDFJS + "pdf.min.js")).then(() => {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
    return window.pdfjsLib;
  }).catch(e => { pdfLibPromise = null; throw e; });
  return pdfLibPromise;
}
async function pdfToImages(file, maxPages) {
  const lib = await getPdfLib();
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const n = Math.min(doc.numPages, maxPages, 3);
  const blobs = []; let preview = null, text = "";
  for (let p = 1; p <= n; p++) {
    const page = await doc.getPage(p);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(3, 2000 / Math.max(base.width, base.height)) });
    const cv = document.createElement("canvas"); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
    const ctx = cv.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, cv.width, cv.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    blobs.push(await new Promise(r => cv.toBlob(r, "image/jpeg", 0.88)));
    if (p === 1) preview = cv.toDataURL("image/jpeg", 0.5);
    try {
      // Text zeilenweise (nach Höhe gruppiert), damit Tabellen lesbar bleiben
      const tc = await page.getTextContent(), lines = new Map();
      tc.items.forEach(it => { const y = Math.round(it.transform[5] / 3); if (!lines.has(y)) lines.set(y, []); lines.get(y).push(it); });
      text += [...lines.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => its.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join(" ").replace(/\s+/g, " ").trim()).filter(Boolean).join("\n") + "\n";
    } catch (e) { }
  }
  return { blobs: blobs.filter(Boolean), preview, text: text.trim() };
}
const isPdf = f => f.type === "application/pdf" || /\.pdf$/i.test(f.name || "");

async function runScan(file) {
  let blobs, preview, pdfText = "";
  if (isPdf(file)) {
    state.scan = { status: "busy", step: "pdf" }; renderScanBox();
    try {
      const r = await pdfToImages(file, sampleMaxImages);
      blobs = r.blobs; preview = r.preview; pdfText = r.text;
      if (!blobs.length) throw new Error("leer");
    } catch (e) {
      state.scan = { status: "error", msg: "Das PDF konnte nicht geöffnet werden. Ist es passwortgeschützt oder beschädigt? Alternativ einen Screenshot der Karte wählen." };
      renderScanBox(); return;
    }
  } else {
    const r = await prepareImage(file); blobs = [r.blob]; preview = r.preview;
  }
  state.scan = { status: "busy", preview }; renderScanBox();
  const known = S.players.map(p => p.name).join(", ") || "keine";
  const source = pdfText || blobs.length > 1
    ? `Die Scorekarte stammt aus einem PDF (${blobs.length} Seite(n) als Bild).${pdfText ? ` Zusätzlich der aus dem PDF extrahierte Text, zeilenweise – nutze ihn, um Zahlen exakt zu übernehmen:\n<<<\n${pdfText.slice(0, 20000)}\n>>>` : ""}\n`
    : "";
  const prompt = `${source}Du liest eine ausgefüllte Golf-Scorekarte (Foto, oft handschriftlich, oder digital aus einer App; deutsch oder englisch).
Gib ausschließlich JSON in genau dieser Form zurück:
{"course": string|null, "date": "YYYY-MM-DD"|null, "par": number[], "strokeIndex": number[], "players": [{"name": string, "strokes": number[]}]}
Regeln:
- "par" und "strokeIndex" (Zeile HCP, Hcp, Vorgabe, Index oder SI) in Lochreihenfolge 1..n, n = 9 oder 18. Nicht lesbar: leeres Array.
- Für jeden Spieler "strokes" mit genau n Einträgen in Lochreihenfolge: die Schlagzahl je Loch, leeres Feld, Strich oder unlesbar = 0.
- Summen- und Ergebnisspalten (Out, In, Aus, Ein, Total, Gesamt, Brutto, Netto, Punkte, Stableford) NICHT in die Loch-Arrays übernehmen.
- Zeilen mit Lochnummern, Längen (Meter/Yards) oder Stableford-Punkten sind keine Spieler.
- Spielernamen so schreiben, wie sie auf der Karte stehen. Bereits bekannte Spieler: ${known}.`;
  try {
    const out = await sample.json(prompt, { images: blobs, modelTier: "default" });
    const res = normalizeScan(out);
    if (!res.players.length) throw { code: "empty" };
    state.scan = { status: "done", preview, result: res };
  } catch (e) {
    const map = { not_granted: "Du hast der Seite den Zugriff auf Claude nicht erlaubt. Trage die Werte direkt ein.", rate_limited: "Gerade zu viele Anfragen. Versuche es in einer Minute erneut.", image_rejected: "Das Bild konnte nicht gelesen werden. Bitte ein JPG- oder PNG-Foto verwenden.", empty: "Auf dem Foto wurden keine Spielerzeilen gefunden. Fotografiere die Karte näher und gut beleuchtet." };
    state.scan = { status: "error", preview, msg: map[e?.code] || "Die Karte konnte nicht gelesen werden. Versuche ein schärferes Foto oder trage die Werte direkt ein." };
  }
  renderScanBox();
}

function normalizeScan(o) {
  const arr = a => Array.isArray(a) ? a.map(x => parseInt(x, 10) || 0) : [];
  const players = (Array.isArray(o?.players) ? o.players : []).map(p => ({ name: String(p?.name || "").trim(), strokes: arr(p?.strokes) })).filter(p => p.strokes.some(s => s > 0));
  let par = arr(o?.par), si = arr(o?.strokeIndex);
  const n = [18, 9].find(k => par.length === k) || [18, 9].find(k => players[0]?.strokes.length >= k) || 18;
  if (par.length && par.length !== n) par = []; if (si.length !== n) si = [];
  par = par.map(x => (x >= 3 && x <= 6) ? x : 4);
  const date = typeof o?.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(o.date) ? o.date : null;
  return { course: o?.course ? String(o.course) : null, date, par, si, n, players: players.map(p => ({ ...p, strokes: fit(p.strokes, n) })) };
}

async function applyScan() {
  const r = state.scan.result, d = state.editor;
  let c = courseById(d.courseId);
  if (!c && $("#map-course-new")?.checked && r.par.length) {
    const par = sum(r.par);
    c = { id: uid(), name: r.course || "Neuer Platz", cr: par, slope: 113, pars: r.par, si: r.si.length ? r.si : Array.from({ length: r.n }, (_, i) => i + 1) };
    await save("courses", c); d.courseId = c.id;
    toast("Platz angelegt – CR und Slope bitte unter „Plätze“ ergänzen");
  } else if (c && $("#map-course-update")?.checked && r.par.length === c.pars.length) {
    c = { ...c, pars: r.par, si: r.si.length ? r.si : c.si }; await save("courses", c);
  }
  if ($("#map-date")?.checked && r.date) d.date = r.date;
  for (let i = 0; i < r.players.length; i++) {
    const sel = $(`#map-${i}`)?.value; if (!sel) continue;
    let pid = sel;
    if (sel === "new") { const p = { id: uid(), name: r.players[i].name, hcp: 54 }; await save("players", p); pid = p.id; }
    const p = playerById(pid);
    let e = d.entries.find(x => x.playerId === pid);
    if (!e) { e = { playerId: pid, hcp: p?.hcp ?? 54, strokes: [] }; d.entries.push(e); }
    e.strokes = fit(r.players[i].strokes, c ? c.pars.length : r.n);
  }
  state.scan = null; render(true);
  toast("Werte übernommen – bitte in der Karte prüfen");
}

function chartSVG(st, key = "pts") {
  const narrow = typeof mobileMQ !== "undefined" && mobileMQ.matches;
  const W = narrow ? 360 : 640, H = narrow ? 250 : 240, L = 30, R = 10, T = 12, B = 28;
  const all = st.flatMap(s => s.points);
  if (!all.length) return `<p class="hint">Noch keine 18-Loch-Runden in diesem Jahr.</p>`;
  const ts = all.map(p => new Date(p.date + "T12:00:00").getTime());
  let t0 = Math.min(...ts), t1 = Math.max(...ts);
  if (t1 - t0 < 864e5 * 14) { t0 -= 864e5 * 7; t1 += 864e5 * 7; }
  const yMax = Math.max(48, Math.ceil(Math.max(...all.map(p => p[key])) / 6) * 6);
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - v / yMax) * (H - T - B);
  let g = "";
  for (let v = 0; v <= yMax; v += 12) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y(36)}" y2="${y(36)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  // Monatsmarken
  const d0 = new Date(t0), months = [];
  for (let d = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); d.getTime() <= t1; d.setMonth(d.getMonth() + 1)) months.push(new Date(d));
  const step = Math.ceil(months.length / 6) || 1;
  months.forEach((m, i) => { if (i % step) return; const xx = x(m.getTime()); g += `<line x1="${xx}" x2="${xx}" y1="${H - B}" y2="${H - B + 4}" stroke="var(--muted)"/><text x="${xx}" y="${H - 8}" text-anchor="middle">${monthLabel(m, new Date(t0).getFullYear() !== new Date(t1).getFullYear())}</text>`; });
  st.forEach((s, i) => {
    const col = `var(${SERIES[i % 5]})`;
    const pts = s.points.map(p => [x(new Date(p.date + "T12:00:00").getTime()), y(p[key])]);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${col}" stroke-width="2.25" stroke-linejoin="round" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
    pts.forEach((p, k) => {
      const tip = `${s.player.name}: ${s.points[k][key]} Punkte · ${fmtDate(s.points[k].date)}${s.points[k].course ? " · " + s.points[k].course : ""}`;
      g += `<circle cx="${p[0]}" cy="${p[1]}" r="${k === pts.length - 1 ? 4.5 : 3}" fill="${col}" stroke="var(--surface)" stroke-width="1.5"/>`
