// ---------- Platzkarten (OpenStreetMap) ----------
const MAP_STYLE = {
  wo: "fill:var(--m-wood)", co: "fill:var(--m-rough)", ro: "fill:var(--m-rough2)", dr: "fill:var(--m-range)",
  fw: "fill:var(--m-fairway)", wa: "fill:var(--m-water);stroke:var(--m-water-s);stroke-width:1", te: "fill:var(--m-tee)",
  gr: "fill:var(--m-green);stroke:var(--m-green-s);stroke-width:1.2", bu: "fill:var(--m-sand);stroke:var(--m-sand-s);stroke-width:.8",
  cl: "fill:var(--m-house)", tr: "fill:none;stroke:var(--m-wood);stroke-width:5;stroke-linecap:round"
};
const mPath = (pts, closed = true) => "M" + pts.map(p => p[0] + " " + p[1]).join("L") + (closed ? "Z" : "");
const holeLen = line => line.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - line[i][0], p[1] - line[i][1]), 0);
// Bahnen passend zum Platz: Kurzplatz nur, wenn der Platz so heißt; bei 9-Loch-Plätzen nur Bahn 1–9
function mapHoles(map, c) {
  if (!map?.holes) return [];
  const wantShort = /kurz/i.test(c?.name || "");
  let hs = map.holes.filter(h => !!(h.name && /kurz/i.test(h.name)) === wantShort && h.line?.length >= 2);
  if (!hs.length) hs = map.holes.filter(h => h.line?.length >= 2);
  const n = c?.pars?.length || 18;
  const byRef = new Map();
  hs.forEach(h => { const r = parseInt(h.ref, 10); if (r >= 1 && r <= n && !byRef.has(r)) byRef.set(r, h); });
  return [...byRef.entries()].sort((a, b) => a[0] - b[0]).map(([r, h]) => ({ ...h, n: r }));
}
function featuresSVG(map) {
  return map.f.map(([k, pts]) => `<path d="${mPath(pts, k !== "tr")}" style="${MAP_STYLE[k] || "fill:var(--m-rough)"}"/>`).join("");
}
function courseMapSVG(map, c, opts = {}) {
  const pad = 20, W = map.w + 2 * pad, H = map.h + 2 * pad;
  const hs = mapHoles(map, c);
  const lab = Math.max(9, Math.min(16, Math.max(map.w, map.h) / 70));
  let g = `<g transform="translate(${pad} ${pad})">${featuresSVG(map)}`;
  hs.forEach(h => {
    g += `<path d="${mPath(h.line, false)}" style="fill:none;stroke:var(--m-line);stroke-width:${lab / 5};stroke-dasharray:${lab / 2} ${lab / 3};opacity:.85"/>`;
  });
  hs.forEach(h => {
    const [x, y] = h.line[0];
    g += `<g ${opts.clickable ? `class="mhole" data-act="map-hole" data-cid="${esc(opts.cid || "")}" data-n="${h.n}" style="cursor:pointer" role="button" aria-label="Loch ${h.n} ansehen"` : ""}><circle cx="${x}" cy="${y}" r="${lab}" style="fill:var(--m-label);stroke:var(--m-label-s);stroke-width:${lab / 6}"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" style="font:700 ${lab * 1.05}px var(--font-display);fill:var(--m-label-t)">${h.n}</text></g>`;
  });
  g += `</g>`;
  return `<svg class="cmap" viewBox="0 0 ${W} ${H}" role="img" aria-label="Platzkarte ${esc(c?.name || "")}"><rect width="${W}" height="${H}" style="fill:var(--m-bg)"/>${g}</svg>`;
}
// Einzelne Bahn: Abschlag unten, Grün oben, mit Länge und Par
function holeMapSVG(map, c, h, opts = {}) {
  const a = h.line[0], b = h.line[h.line.length - 1];
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
  const rot = -90 - ang;
  const L = holeLen(h.line), cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
  const R = rot * Math.PI / 180, cos = Math.cos(R), sin = Math.sin(R);
  const rp = p => [cos * (p[0] - cx) - sin * (p[1] - cy), sin * (p[0] - cx) + cos * (p[1] - cy)];
  const lr = h.line.map(rp);
  const xs = lr.map(p => p[0]), ys = lr.map(p => p[1]);
  const span = Math.max(...ys) - Math.min(...ys), s = (span + 90) / 600;   // Strichstärken relativ zur Größe
  const top = opts.noHead ? 45 : 50 + 34 * s, vh = span + top + 40, vw = Math.max(150, (Math.max(...xs) - Math.min(...xs)) + 130, vh * 0.5);
  const vx = (Math.max(...xs) + Math.min(...xs)) / 2 - vw / 2, vy = Math.min(...ys) - top;
  let g = `<g transform="rotate(${rot}) translate(${-cx} ${-cy})">${featuresSVG(map)}</g>`;
  g += `<path d="${mPath(lr, false)}" style="fill:none;stroke:var(--m-line);stroke-width:${3 * s};stroke-dasharray:${8 * s} ${6 * s}"/>`;
  // 50-m-Markierungen ab Abschlag entlang der Linie
  let acc = 0, next = 50;
  for (let i = 1; i < lr.length; i++) {
    const p = lr[i - 1], q = lr[i], seg = Math.hypot(q[0] - p[0], q[1] - p[1]);
    while (acc + seg >= next && next < L - 20) {
      const t = (next - acc) / seg, x = p[0] + (q[0] - p[0]) * t, y = p[1] + (q[1] - p[1]) * t;
      g += `<circle cx="${x}" cy="${y}" r="${3.2 * s}" style="fill:var(--m-label)"/><text x="${x + 9 * s}" y="${y}" dominant-baseline="central" style="font:600 ${13 * s}px var(--font-display);fill:var(--m-label-t2)">${next}</text>`;
      next += 50;
    }
    acc += seg;
  }
  const t0 = lr[0], tN = lr[lr.length - 1];
  g += `<circle cx="${t0[0]}" cy="${t0[1]}" r="${7 * s}" style="fill:var(--m-label);stroke:var(--m-label-s);stroke-width:${1.5 * s}"/>`;
  g += `<path d="M${tN[0]} ${tN[1]}v${-26 * s}" style="stroke:var(--m-label-t2);stroke-width:${2 * s}"/><path d="M${tN[0]} ${tN[1] - 26 * s}l${16 * s} ${5 * s}l${-16 * s} ${5 * s}z" style="fill:var(--m-flag)"/>`;
  const par = c?.pars?.[h.n - 1] ?? h.par;
  const head = `<rect x="${vx}" y="${vy}" width="${vw}" height="${34 * s}" style="fill:var(--m-head)"/><text x="${vx + 10 * s}" y="${vy + 17 * s}" dominant-baseline="central" style="font:700 ${17 * s}px var(--font-display);fill:var(--m-head-t)">Loch ${h.n}${par ? ` · Par ${par}` : ""} · ${Math.round(L)} m</text>`;
  return `<svg class="hmap" viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="Bahn ${h.n}"><rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" style="fill:var(--m-bg)"/>${g}${opts.noHead ? "" : head}</svg>`;
}
// Kartenlookup: Dokument in "coursemaps", Schlüssel = c.mapKey oder Teil der Platz-ID vor dem ersten "-"
const MAPS = {};
const mapKeyOf = c => c ? (c.mapKey || String(c.id || "").split("-")[0]) : null;
const mapOf = c => { const m = c && (MAPS[c.id] || MAPS[mapKeyOf(c)]); return m?.f?.length ? m : null; };
function holeViewHTML(c) {
  const map = mapOf(c); if (!map) return "";
  const hs = mapHoles(map, c); if (!hs.length) return "";
  const n = state.mapHole?.cid === c.id ? state.mapHole.n : null;
  const h = hs.find(x => x.n === n);
  if (!h) return `<p class="hint">Tippe auf eine Lochnummer, um die Bahn vom Abschlag aus zu sehen.</p>`;
  const i = hs.indexOf(h), prev = hs[(i - 1 + hs.length) % hs.length], next = hs[(i + 1) % hs.length];
  return `<div class="row"><button class="btn ghost" data-act="map-hole" data-cid="${esc(c.id)}" data-n="${prev.n}">← Loch ${prev.n}</button><span class="spacer"></span>
    <button class="btn ghost" data-act="map-hole" data-cid="${esc(c.id)}" data-n="0">Schließen</button><button class="btn ghost" data-act="map-hole" data-cid="${esc(c.id)}" data-n="${next.n}">Loch ${next.n} →</button></div>
    <div class="hmap-wrap">${holeMapSVG(map, c, h)}</div>
    <p class="hint">Länge entlang der eingezeichneten Spiellinie aus OpenStreetMap, nicht vom gelben Abschlag gemessen. Punkte alle 50 m ab Abschlag.</p>`;
}
// Kleines Vorschaubild aus der Platzkarte (ohne Beschriftung, nur große Flächen)
function mapThumbSVG(map) {
  const big = map.f.filter(([k, pts]) => k !== "bu" && k !== "tr" && k !== "te" || pts.length > 12);
  return `<svg viewBox="0 0 ${map.w} ${map.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Platzkarte"><rect width="${map.w}" height="${map.h}" style="fill:var(--m-bg)"/>${featuresSVG({ f: big })}</svg>`;
}
const courseThumb = c => c.photo ? aerialImg(c.photo) : mapOf(c) ? mapThumbSVG(mapOf(c))
  : `<svg viewBox="0 0 96 54" aria-hidden="true"><path d="M44 40V14l14 5-14 5" style="fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round;opacity:.55"/><ellipse cx="44" cy="41" rx="10" ry="2.5" style="fill:var(--line)"/></svg>`;
function courseMapHTML(c, title = "Platzkarte") {
  const map = mapOf(c); if (!map) return "";
  const hs = mapHoles(map, c);
  return `<div class="cmap-block" data-cid="${esc(c.id)}"><h3>${title}</h3>
    <div class="cmap-wrap">${courseMapSVG(map, c, { clickable: hs.length > 0, cid: c.id })}</div>
    ${hs.length ? "" : `<p class="hint">In OpenStreetMap sind für diesen Platz noch keine Bahnen eingezeichnet.</p>`}
    <div class="mhv">${holeViewHTML(c)}</div>
    <p class="hint attr">Kartendaten © OpenStreetMap-Mitwirkende, ODbL</p></div>`;
}

// ---------- Teilbare Rundenkarte (Bild für WhatsApp) ----------
// Badges, die ein Spieler in genau dieser Runde geholt hat (inkl. Meilensteine); isNew = erstes Mal überhaupt
function roundBadges(r, e) {
  const c = courseById(r.courseId); if (!c) return [];
  const res = result(e, c), st = fit(e.strokes, c.pars.length);
  let run = 0, streak = 0, run2 = 0, triple2 = 0;
  st.forEach((v, i) => {
    run = v > 0 && v <= c.pars[i] ? run + 1 : 0; streak = Math.max(streak, run);
    run2 = v > 0 && v - c.pars[i] === 2 ? run2 + 1 : 0;
    if (run2 === 3) { triple2++; run2 = 0; }
  });
  const diffs = st.map((v, i) => v > 0 ? v - c.pars[i] : null);
  const info = { full: c.pars.length === 18 && res.complete, n18: c.pars.length === 18, gross: res.gross, pts: res.pts, streak, triple2,
    birdies: diffs.filter(d => d === -1).length, eagles: diffs.filter(d => d === -2).length };
  // laufende Rundenzahl dieses Spielers bis einschließlich dieser Runde (gleiche Reihenfolge wie playerBadges)
  const mine = [...S.rounds].filter(x => x.date && courseById(x.courseId) && (x.entries || []).some(y => y.playerId === e.playerId)).sort((a, b) => a.date.localeCompare(b.date));
  const nr = r.id ? mine.findIndex(x => x.id === r.id) + 1 : 0;
  const pb = playerBadges(e.playerId);
  const out = [];
  BADGES.forEach(b => {
    if (b.milestone) { if (nr === b.milestone) out.push({ b, count: 1, isNew: true }); return; }
    const k = +b.test(info); if (!k) return;
    out.push({ b, count: k, isNew: pb[b.id]?.firstEver === r.date });
  });
  // Bei Schwellen nur die beste zeigen (unter 90 statt zusätzlich unter 100 und 110)
  const tiers = ["u80", "u90", "u100", "u110"], best = tiers.find(id => out.some(x => x.b.id === id));
  return out.filter(x => !tiers.includes(x.b.id) || x.b.id === best);
}

const CARD_C = { green: "#1c6641", greenDark: "#134a2f", ink: "#142019", muted: "#58675e", line: "#d3ddd5", paper: "#f4f7f3", gold: "#e2b230",
  bronze: "#a8692f", silver: "#7c8a93", goldB: "#b8890b", greenB: "#1c6641", copper: "#8a5a44", neg: "#9b1c1c",
  av: ["#1c6641", "#c2410c", "#2563eb", "#a21caf", "#a16207"] };
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });

// Ohne Luftbild/Karte: stilisierter Platz als Hintergrund, darauf die Score-Verteilung je Spieler
function drawScoreBand(g, d, c, X, Y, W, H) {
  const F = "'Barlow Condensed', 'Arial Narrow', sans-serif", B = "'Public Sans', system-ui, sans-serif";
  g.save(); g.beginPath(); g.rect(X, Y, W, H); g.clip();
  const bg = g.createLinearGradient(0, Y, 0, Y + H); bg.addColorStop(0, "#e3efdc"); bg.addColorStop(1, "#c9e0bd");
  g.fillStyle = bg; g.fillRect(X, Y, W, H);
  // Fairways als weiche Bahnen, Grün mit Fahne, ein paar Bunker
  const fw = (pts, w, col) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(...pts[0]); for (let i = 1; i < pts.length; i += 3) g.bezierCurveTo(...pts[i], ...pts[i + 1], ...pts[i + 2]); g.stroke(); };
  fw([[X - 40, Y + H * .95], [X + W * .2, Y + H * .55], [X + W * .45, Y + H * 1.05], [X + W * .62, Y + H * .62]], 120, "rgba(134,196,124,.45)");
  fw([[X + W * .55, Y - 40], [X + W * .75, Y + H * .25], [X + W * .95, Y + H * .1], [X + W + 60, Y + H * .45]], 110, "rgba(134,196,124,.35)");
  // Grün mit Fahne oben rechts in der Titelzeile, außerhalb der Balken

// --- GSPro-Datei lesen → geplante Simulator-Runden ---
function gsproRounds(x) {
  const H = Array.from({ length: 18 }, (_, i) => String(i + 1));
  const byRound = {}; (x.scorecards || []).forEach(s => (byRound[s.roundKey] ??= []).push(s));
  const stats = {}; (x.scores || []).forEach(s => stats[s.roundKeyPlayerKey] = s);
  const sg = {}; (x.strokesGained || []).forEach(s => sg[s.roundKeyPlayerKey] = s);
  const unit = x.units?.distanceUoM || "m", out = [];
  for (const r of x.rounds || []) {
    if (!r?.roundKey || !ZIP_OK_ID.test("gspro-" + r.roundKey)) continue;
    const rows = byRound[r.roundKey] || [];
    const par = rows.find(s => !s.playerKey && s.rowLabel?.trim() === "Par"), idx = rows.find(s => !s.playerKey && s.rowLabel?.trim() === "Index");
    const tee = rows.find(s => !s.playerKey && s !== par && s !== idx);
    if (!par) continue;
    const keys = H.filter(k => +par.holeValue?.[k] > 0), n = keys.length;
    if (!n) continue;
    const entries = rows.filter(s => s.playerKey).map(s => {
      const strokes = keys.map(k => Math.max(0, Math.min(20, parseInt(s.holeValue?.[k], 10) || 0)));
      const k = r.roundKey + "|" + s.playerKey, a = stats[k], g = sg[k];
      const e = { mapKey: "g:" + s.playerKey, gsproPlayer: s.playerKey, name: String(s.rowLabel || "").trim() || "Spieler", strokes };
      if (a) e.stats = { putts: a.puttsValue, fir: a.fairwaysValue, firOf: a.fairwaysTarget, gir: a.greensValue, girOf: a.greensTarget, sand: a.sandSavesValue, sandOf: a.sandSavesTarget, drive: a.drivingDistanceLongest ? Math.round(a.drivingDistanceLongest) : null };
      if (g) e.sg = { tee: g.tee, app: g.approach, arg: g.around, putt: g.putting, total: g.total };
      return e;
    }).filter(e => e.strokes.some(Boolean));
    if (!entries.length) continue;
    const begin = new Date(r.roundBegin), ok = !isNaN(begin);
    const pad = v => String(v).padStart(2, "0");
    const [cr, slope] = String(r.ratingSlope || "").split("/").map(Number);
    out.push({
      id: "gspro-" + r.roundKey, source: "gspro", gsproRound: r.roundKey,
      date: ok ? `${begin.getFullYear()}-${pad(begin.getMonth() + 1)}-${pad(begin.getDate())}` : String(r.roundBegin || "").slice(0, 10),
      time: ok ? `${pad(begin.getHours())}:${pad(begin.getMinutes())}` : "",
      course: { name: String(r.courseName || "Simulator-Platz").trim(), tee: r.teeType || "", cr: cr > 0 ? cr : null, slope: slope > 0 ? slope : null,
        pars: keys.map(k => +par.holeValue[k]), si: idx ? keys.map(k => +idx.holeValue?.[k] || 0) : [], lengths: tee ? keys.map(k => +tee.holeValue?.[k] || 0) : [], unit },
      roundType: r.roundType || "", entries
    });
  }
  return out;
}

function planSimImport(rounds, meta) {

  h += `<section class="panel"><h3>Runden</h3>${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th><th>Platz</th><th>Brutto</th><th>± Par</th><th>Putts</th><th>Fairways</th><th>Grüns</th><th>SG</th></tr></thead><tbody>

    </tbody></table></div>` : `<p class="hint">Keine Simulator-Runden für diese Auswahl.</p>`}
    <p class="hint">Durchschnitte nur aus vollständigen 18-Loch-Runden. Abgebrochene Runden zeigen die gespielten Löcher. Putts, Fairways, Grüns und Strokes Gained nur, wenn GSPro sie für die ganze Runde liefert (bei fortgesetzten Runden fehlen sie).</p></section>`;
  return h + simSetupHTML(false);

function simRoundHTML() {

    if (simStatsOk(e, res)) cells.push(["Putts", s.putts], ["Fairways", s.firOf ? `${s.fir}/${s.firOf}` : "–"], ["Grüns", s.girOf ? `${s.gir}/${s.girOf}` : "–"], ["Sand Saves", s.sandOf ? `${s.sand}/${s.sandOf}` : "–"], ["Längster Drive", s.drive ? `${s.drive} ${esc(r.course.unit || "m")}` : "–"]);

// --- Simulator-Runden teilen: Bogey-Datei mit kind "simulator" (Spieler zum Zuordnen, keine Plätze, keine normalen Runden) ---
async function exportSim() {
  const say = t => toast(t);
  try {
    const ids = new Set(S.simrounds.flatMap(r => (r.entries || []).map(e => e.playerId)));
    const players = S.players.filter(p => ids.has(p.id)).map(({ id, name }) => ({ id, name }));
    await saveOrShare(await bogeyFile("simulator", { players, courses: [], rounds: [], maps: {}, simrounds: S.simrounds }), `Bogey-Club-Simulator-${today()}${BOGEY_EXT}`, say, true);
  } catch (e) { say("Die Datei konnte nicht erstellt werden."); }
}
async function readSimFile(file) {
  const g = await looksLikeGspro(file);
  if (g) return readGsproFile(file, g);
  try {
    const f = await readBogeyFile(file);
    if (f.simrounds.length && (f.kind === "simulator" || !f.rounds.length)) return planSharedSim(f);
    simPending = { error: f.simrounds.length ? "Das ist ein vollständiges Backup – bitte unter Mehr → Backup einspielen." : "In dieser Datei sind keine Simulator-Runden." };
  } catch (e) { simPending = { error: e?.message === "newer" ? "Diese Datei stammt aus einer neueren Bogey-Club-Version. Bitte zuerst die App aktualisieren." : "Diese Datei ist weder ein GSPro-Export noch eine Bogey-Datei mit Simulator-Runden." }; }
  if (state.tab !== "sim") goTab("sim"); else render(true);
}

const confirmArm = {};
function armed(key, btn, label) {
  if (confirmArm[key]) { delete confirmArm[key]; return true; }
  confirmArm[key] = true; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { delete confirmArm[key]; if (btn.isConnected) btn.textContent = old; }, 3500);
  return false;
}

function readCourseFields() {
  const c = state.course;
  c.name = $("#co-name").value; const cr = num($("#co-cr").value), sl = parseInt($("#co-slope").value, 10);
  c.cr = isFinite(cr) ? cr : sum(c.pars); c.slope = sl > 0 ? sl : 113;
  c.pars = c.pars.map((_, i) => +$("#co-par-" + i).value || 4);
  c.si = c.si.map((_, i) => parseInt($("#co-si-" + i).value, 10) || 0);
}

const courseQuery = c => String(c.name || "").replace(/\s*\((gelb|weiß|weiss|rot|blau|schwarz)\)\s*$/i, "").replace(/\s*\(9 Loch\)\s*$/i, "").trim();
const mapLinks = c => { const q = encodeURIComponent(courseQuery(c)); return `<div class="maplinks"><a class="btn ghost" href="https://maps.apple.com/?q=${q}&t=k" target="_blank" rel="noopener">Satellit in Apple Karten</a><a class="btn ghost" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a></div>`; };
const aerialImg = (id, alt = "") => id ? `<img src="/_blob/${esc(id)}" alt="${esc(alt)}" loading="lazy" onerror="this.parentNode.textContent='Bild nicht verfügbar'">` : "";
// Querformat 16:9 zuschneiden, max. 1600 px breit
async function landscapeJpeg(file) {
  const bmp = await createImageBitmap(file);
  let sw = bmp.width, sh = Math.round(bmp.width * 9 / 16);
  if (sh > bmp.height) { sh = bmp.height; sw = Math.round(bmp.height * 16 / 9); }
  const ow = Math.min(1600, sw), oh = Math.round(ow * 9 / 16);
  const cv = document.createElement("canvas"); cv.width = ow; cv.height = oh;
  cv.getContext("2d").drawImage(bmp, (bmp.width - sw) / 2, (bmp.height - sh) / 2, sw, sh, 0, 0, ow, oh);
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("leer")), "image/jpeg", 0.85));
}
async function uploadCoursePhoto(file) {
  if (!assetsApi || !state.course) return;
  readCourseFields();
  const c = state.course; c.uploading = true; render(true);
  try {
    const res = await assetsApi.upload(await landscapeJpeg(file));
    const orig = c.id ? courseById(c.id)?.photo : null;
    if (c.photo && c.photo !== orig) dropAsset(c.photo);
    c.photo = res.id; toast("Luftbild hochgeladen – zum Übernehmen „Platz sichern“ tippen");
  } catch (e) {
    toast({ quota_exceeded: "Der Speicher für Bilder ist voll.", too_large: "Das Bild ist zu groß.", unsupported_type: "Bitte ein JPG oder PNG verwenden." }[e?.code] || "Das Bild konnte nicht hochgeladen werden.");
  } finally { if (state.course === c) { c.uploading = false; render(true); } }
}

// ---------- Spielerbilder (Asset-Speicher) ----------
let assetsApi = null, assetsChecked = false;
async function initAssets() {
  try { assetsApi = window.claude?.use ? await claude.use("assets") : null; } catch (e) { assetsApi = null; }
  assetsChecked = true;
  if (state.tab === "players" && state.player) render(true);
}
// Mittig quadratisch zuschneiden, 400 px, JPEG
async function squareJpeg(file) {
  const bmp = await createImageBitmap(file);
  const side = Math.min(bmp.width, bmp.height), out = Math.min(400, side);
  const cv = document.createElement("canvas"); cv.width = cv.height = out;
  cv.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) / 2, side, side, 0, 0, out, out);
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("leer")), "image/jpeg", 0.86));
}
async function uploadPlayerPhoto(file) {
  if (!assetsApi || !state.player) return;
  syncPlayerFields();
  const f = state.player;
  f.uploading = true; render(true);
  try {
    const blob = await squareJpeg(file);
    const res = await assetsApi.upload(blob);
    const orig = f.id ? playerById(f.id)?.photo : null;
    if (f.photo && f.photo !== orig) dropAsset(f.photo);   // vorheriges, nicht gesichertes Bild
    f.photo = res.id;
    toast("Bild hochgeladen – zum Übernehmen „Sichern“ tippen");
  } catch (e) {
    const msg = { quota_exceeded: "Der Speicher für Bilder ist voll.", too_large: "Das Bild ist zu groß.", unsupported_type: "Dieses Bildformat wird nicht unterstützt. Bitte JPG oder PNG verwenden.", not_granted: "Du darfst auf dieser Seite keine Bilder hinzufügen." };
    toast(msg[e?.code] || "Das Bild konnte nicht hochgeladen werden. Bitte erneut versuchen.");
  } finally {
    if (state.player === f) { f.uploading = false; render(true); }
  }
}
// Eingaben im Spielerformular vor einem Neuaufbau übernehmen
function syncPlayerFields() {
  if (!state.player) return;
  const n = $("#pl-name"), h = $("#pl-hcp");
  if (n) state.player.name = n.value;
  if (h) { const v = num(h.value); state.player.hcp = isFinite(v) ? v : state.player.hcp; }
  const hd = $("#pl-hidden"); if (hd) state.player.hidden = hd.checked;
}
function dropAsset(id) { if (assetsApi && id) assetsApi.delete(id).catch(() => {}); }

initStore();
initSample();
initAssets();
</script>
