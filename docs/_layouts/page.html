---
layout: default
---
<article class="wrap page-body">
  <header class="page-head">
    <p class="kicker">{{ page.kicker | default: site.title }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
