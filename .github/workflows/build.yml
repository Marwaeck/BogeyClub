# Automatische Builds für Bogey Club.
#
# - Jeder Push auf main und jeder Pull Request: Web-Version bauen, Tests laufen lassen, Mac-, Windows- und
#   Android-App bauen. Die fertigen Dateien (ZIP bzw. APK) liegen danach 14 Tage lang unter „Actions“ → Lauf →
#   „Artifacts“.
# - Ein Tag „v1.2.3“ (legt `npm run release` an): zusätzlich das GitHub-Release mit ZIP-Dateien und APK
#   veröffentlichen. Die Neuerungen kommen aus der Tag-Nachricht. Die Updater in den Apps finden es dort.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  web:
    name: Web-Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web-App für GitHub Pages bauen (docs/app)
        run: node build.mjs
      - name: Syntax prüfen
        run: for f in server/runtime.js server/sw.js server/ocr.js docs/app/sw.js; do node --check "$f"; done
      - name: Ist docs/app aktuell?
        run: |
          if [ -n "$(git status --porcelain -- docs/app)" ]; then
            git status --short -- docs/app
            echo "::error::docs/app ist veraltet – npm run build ausführen und hochladen"; exit 1
          fi

  mac:
    name: Mac-App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests Scorekarten-Erkennung (BogeyScan)
        working-directory: BogeyScan
        run: swift test
      - name: Tests Datenablage (mac)
        working-directory: mac
        run: swift test
      - name: App bauen
        run: zsh mac/build.sh
      - name: Version bestimmen
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/Bogey-Club-mac-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows-App
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Abhängigkeiten installieren
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: App bauen
        run: npm run dist
      - name: Version bestimmen
        id: v
        shell: bash
        run: echo "version=$(node -p "require('../package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/dist/Bogey-Club-windows-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iPhone-App (Build-Prüfung)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Für den Simulator bauen (ohne Signatur)
        working-directory: ios/GolfScorebuch
        run: xcodebuild -project GolfScorebuch.xcodeproj -scheme GolfScorebuch -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build

  android:
    name: Android-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Texterkennung laden und Oberfläche vorbereiten
        run: |
          npm --prefix android ci --no-audit --no-fund
          node mac/prepare-web.mjs --target android
      - name: Signierschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bogeyclub.keystore"
            echo "BOGEY_KEYSTORE=$RUNNER_TEMP/bogeyclub.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Android-Schlüssel hinterlegt (scripts/android-key.sh). Die APK ist mit einem Testschlüssel signiert – Updates lassen sich dann nicht über die installierte App spielen."
          fi
      - name: APK bauen
        working-directory: android
        env:
          BOGEY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Version bestimmen
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/app-release.apk "android/dist/Bogey-Club-android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/dist/Bogey-Club-android-${{ steps.v.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, mac, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag gegen package.json prüfen
        id: v
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Neuerungen aus der Tag-Nachricht
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          [ -n "$NOTES" ] || NOTES="Bogey Club ${{ steps.v.outputs.version }}"
          printf '%s\n' "$NOTES" > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.apk \
            --title "Bogey Club ${{ steps.v.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
